name: Finalize IndexedDB migration

on:
  push:
    branches: [rebuild/server-postgres-indexeddb]
    paths:
      - .github/workflows/finalize-indexeddb.yml

permissions:
  contents: write

concurrency:
  group: prosmet-finalize-indexeddb
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Verify runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: rebuild/server-postgres-indexeddb
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Update estimate editor terminology and browser UUID
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("components/tools/estimate-editor.tsx")
          text = path.read_text()
          if 'import { browserUuid } from "@/lib/platform/browser-crypto";' not in text:
              marker = 'import { exportEstimatePdf, exportEstimateXlsx } from "@/lib/exports/estimate";'
              if marker not in text:
                  raise SystemExit("Estimate editor import marker missing")
              text = text.replace(marker, f'import {{ browserUuid }} from "@/lib/platform/browser-crypto";\n{marker}')
          text = text.replace('useRef(`estimate_${crypto.randomUUID()}`)', 'useRef(`estimate_${browserUuid()}`)')
          text = text.replace(' /> SQLite', ' /> IndexedDB')
          path.write_text(text)
          PY

          rm -f .github/workflows/primary.yml
          rm -f .github/workflows/finalize-indexeddb.yml

      - name: Generate clean lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify source, types, unit tests and build
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run source:contract
          npm run typecheck
          npm run test
          npm run build

      - name: Commit verified files
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(storage): finalize IndexedDB and PostgreSQL migration"
          git push origin HEAD:rebuild/server-postgres-indexeddb
