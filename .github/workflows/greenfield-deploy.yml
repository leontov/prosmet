name: Prosmet Greenfield Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prosmet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ops/greenfield-production-release'
      )
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
      RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      RELEASE_DIR: $HOME/.prosmet-greenfield/releases/${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Verify trusted runner and release source
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          test -n "$RELEASE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.head.ref }}" = "ops/greenfield-production-release"
            test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout is the exact release SHA
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install and verify exact main SHA
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata
          npx playwright install chromium
          npm run e2e

      - name: Install immutable release
        run: |
          set -Eeuo pipefail
          mkdir -p "$RELEASE_DIR"
          rm -rf "$RELEASE_DIR/dist"
          cp -a apps/web/dist "$RELEASE_DIR/dist"
          cp apps/web/server.mjs "$RELEASE_DIR/server.mjs"
          cp deployment/ensure-public-edge.sh "$RELEASE_DIR/ensure-public-edge.sh"
          chmod 0755 "$RELEASE_DIR/ensure-public-edge.sh"
          printf '%s\n' "$RELEASE_SHA" > "$RELEASE_DIR/SHA"
          cat > "$RELEASE_DIR/release.json" <<EOF
          {"releaseSha":"$RELEASE_SHA","repository":"${{ github.repository }}","event":"${{ github.event_name }}","runId":"${{ github.run_id }}"}
          EOF

      - name: Switch persistent process on port 3200
        run: |
          set -Eeuo pipefail
          if command -v fuser >/dev/null 2>&1; then fuser -k 3200/tcp || true; fi
          if command -v lsof >/dev/null 2>&1; then
            PIDS="$(lsof -tiTCP:3200 -sTCP:LISTEN || true)"
            if [ -n "$PIDS" ]; then kill $PIDS || true; fi
          fi
          sleep 1
          mkdir -p "$HOME/.prosmet-greenfield"
          cd "$RELEASE_DIR"

          nohup env -u RUNNER_TRACKING_ID \
            PORT=3200 \
            PROSMET_RELEASE_SHA="$RELEASE_SHA" \
            node server.mjs \
            </dev/null > "$HOME/.prosmet-greenfield/production.log" 2>&1 &
          PID=$!
          disown "$PID" 2>/dev/null || true
          printf '%s\n' "$PID" > "$HOME/.prosmet-greenfield/production.pid"

          sleep 1
          kill -0 "$PID"
          if tr '\0' '\n' < "/proc/$PID/environ" | grep -q '^RUNNER_TRACKING_ID='; then
            echo "Production process still contains RUNNER_TRACKING_ID" >&2
            exit 1
          fi

      - name: Verify immediate local release
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 40); do
            HEALTH="$(curl -fsS http://127.0.0.1:3200/api/health || true)"
            if printf '%s' "$HEALTH" | grep -q "$RELEASE_SHA" && printf '%s' "$HEALTH" | grep -q '"ui":"greenfield"'; then
              printf '%s\n' "$HEALTH" > local-health-immediate.json
              exit 0
            fi
            sleep 1
          done
          cat "$HOME/.prosmet-greenfield/production.log" || true
          exit 1

      - name: Reconcile canonical public HTTPS route
        run: |
          set -Eeuo pipefail
          PROSMET_EXPECTED_RELEASE_SHA="$RELEASE_SHA" \
            bash "$RELEASE_DIR/ensure-public-edge.sh" kolibriai.online 3200
          cp "$HOME/.prosmet/caddy/status.json" edge-status-immediate.json
          cp "$HOME/.prosmet/caddy/public-health-body.txt" edge-public-health-immediate.json
          cp "$HOME/.prosmet/caddy/public-health-headers.txt" edge-public-health-headers-immediate.txt
          cp "$HOME/.prosmet/caddy/edge-diagnostics.txt" edge-diagnostics-immediate.txt 2>/dev/null || true

      - name: Verify immediate public HTTPS
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 40); do
            HEALTH="$(curl -fsS https://kolibriai.online/api/health || true)"
            if printf '%s' "$HEALTH" | grep -q "$RELEASE_SHA" && printf '%s' "$HEALTH" | grep -q '"ui":"greenfield"'; then
              printf '%s\n' "$HEALTH" > public-health-immediate.json
              curl -fsSI https://kolibriai.online/ > public-headers-immediate.txt
              curl -fsSI http://kolibriai.online/ > public-redirect-immediate.txt || true
              exit 0
            fi
            sleep 2
          done
          printf 'Expected release SHA: %s\n' "$RELEASE_SHA"
          curl -sS -D public-health-failure-headers.txt \
            -o public-health-failure-body.txt \
            https://kolibriai.online/api/health || true
          cat public-health-failure-headers.txt || true
          cat public-health-failure-body.txt || true
          exit 1

      - name: Immediate live desktop and mobile acceptance
        run: |
          set -Eeuo pipefail
          ADMIN_TOKEN_FILE="$HOME/.prosmet-greenfield/config/admin.token"
          test -s "$ADMIN_TOKEN_FILE"
          PROSMET_BASE_URL=https://kolibriai.online \
            PROSMET_E2E_ADMIN_TOKEN="$(tr -d '\r\n' < "$ADMIN_TOKEN_FILE")" \
            PROSMET_EVIDENCE_DIR="$RELEASE_DIR/production-evidence" \
            npm run e2e

      - name: Upload immediate deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-deploy-${{ github.run_id }}
          path: |
            local-health-immediate.json
            public-health-immediate.json
            public-headers-immediate.txt
            public-redirect-immediate.txt
            public-health-failure-headers.txt
            public-health-failure-body.txt
            edge-status-immediate.json
            edge-public-health-immediate.json
            edge-public-health-headers-immediate.txt
            edge-diagnostics-immediate.txt
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
          if-no-files-found: warn
          retention-days: 30

  post_cleanup_persistence:
    name: Verify service and edge survived runner cleanup
    needs: deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      RELEASE_DIR: $HOME/.prosmet-greenfield/releases/${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Verify detached process and repair edge after previous job cleanup
        run: |
          set -Eeuo pipefail
          sleep 8
          PID_FILE="$HOME/.prosmet-greenfield/production.pid"
          test -s "$PID_FILE"
          PID="$(cat "$PID_FILE")"
          kill -0 "$PID"

          if tr '\0' '\n' < "/proc/$PID/environ" | grep -q '^RUNNER_TRACKING_ID='; then
            echo "Persistent process unexpectedly contains RUNNER_TRACKING_ID" >&2
            exit 1
          fi

          ps -o pid=,ppid=,etime=,cmd= -p "$PID" | tee post-cleanup-process.txt
          tr '\0' '\n' < "/proc/$PID/environ" | sed '/TOKEN\|SECRET\|KEY\|PASSWORD/d' > post-cleanup-environment.txt

          LOCAL_HEALTH="$(curl -fsS http://127.0.0.1:3200/api/health)"
          printf '%s\n' "$LOCAL_HEALTH" > local-health-post-cleanup.json
          printf '%s' "$LOCAL_HEALTH" | grep -q "$RELEASE_SHA"
          printf '%s' "$LOCAL_HEALTH" | grep -q '"ui":"greenfield"'

          PROSMET_EXPECTED_RELEASE_SHA="$RELEASE_SHA" \
            bash "$RELEASE_DIR/ensure-public-edge.sh" kolibriai.online 3200

          PUBLIC_STATUS="$(curl --silent --show-error \
            --output public-health-post-cleanup.json \
            --dump-header public-headers-post-cleanup.txt \
            --write-out '%{http_code}' \
            https://kolibriai.online/api/health || true)"
          test "$PUBLIC_STATUS" = "200"
          grep -q "$RELEASE_SHA" public-health-post-cleanup.json
          grep -q '"ui":"greenfield"' public-health-post-cleanup.json

          ROOT_STATUS="$(curl --silent --show-error \
            --output public-root-post-cleanup.html \
            --dump-header public-root-headers-post-cleanup.txt \
            --write-out '%{http_code}' \
            https://kolibriai.online/ || true)"
          test "$ROOT_STATUS" = "200"
          grep -Eqi '^strict-transport-security:.*max-age=31536000' public-root-headers-post-cleanup.txt

          cp "$HOME/.prosmet/caddy/status.json" edge-status-post-cleanup.json
          cp "$HOME/.prosmet/caddy/edge-diagnostics.txt" edge-diagnostics-post-cleanup.txt 2>/dev/null || true

      - name: Upload post-cleanup persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-persistence-${{ github.run_id }}
          path: |
            post-cleanup-process.txt
            post-cleanup-environment.txt
            local-health-post-cleanup.json
            public-health-post-cleanup.json
            public-headers-post-cleanup.txt
            public-root-post-cleanup.html
            public-root-headers-post-cleanup.txt
            edge-status-post-cleanup.json
            edge-diagnostics-post-cleanup.txt
          if-no-files-found: warn
          retention-days: 30

  external_acceptance:
    name: Verify every public route from an external GitHub-hosted runner
    needs: post_cleanup_persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      PROSMET_BASE_URL: https://kolibriai.online
    steps:
      - name: Resolve public DNS and verify HTTPS from outside Primary
        run: |
          set -Eeuo pipefail
          getent ahostsv4 kolibriai.online | tee external-dns-v4.txt
          test -s external-dns-v4.txt
          getent ahostsv6 kolibriai.online | tee external-dns-v6.txt || true

          mapfile -t IPV4_ADDRESSES < <(awk '{print $1}' external-dns-v4.txt | sort -u)
          test "${#IPV4_ADDRESSES[@]}" -gt 0
          for address in "${IPV4_ADDRESSES[@]}"; do
            safe_address="${address//./-}"
            curl --fail --show-error --silent \
              --retry 6 --retry-delay 3 --retry-all-errors \
              --resolve "kolibriai.online:443:${address}" \
              https://kolibriai.online/api/health \
              > "external-health-${safe_address}.json"
            grep -q "$RELEASE_SHA" "external-health-${safe_address}.json"
            grep -q '"ui":"greenfield"' "external-health-${safe_address}.json"
          done

          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://kolibriai.online/api/health > external-public-health.json
          grep -q "$RELEASE_SHA" external-public-health.json
          grep -q '"ui":"greenfield"' external-public-health.json
          curl -fsSI https://kolibriai.online/ > external-public-headers.txt
          curl -fsSI http://kolibriai.online/ > external-public-redirect.txt || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Verify external checkout SHA
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install browser acceptance dependencies
        run: |
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: External live desktop and mobile acceptance
        env:
          PROSMET_CRITICAL_PATH: "false"
        run: npm run e2e

      - name: Delayed external persistence probe
        run: |
          set -Eeuo pipefail
          sleep 30
          curl --fail --show-error --silent \
            --retry 8 --retry-delay 5 --retry-all-errors \
            https://kolibriai.online/api/health > external-public-health-delayed.json
          grep -q "$RELEASE_SHA" external-public-health-delayed.json
          grep -q '"ui":"greenfield"' external-public-health-delayed.json
          curl -fsS https://kolibriai.online/ > external-public-root-delayed.html
          grep -q '<div id="root"></div>' external-public-root-delayed.html

      - name: Upload final external production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-production-${{ github.run_id }}
          path: |
            external-dns-v4.txt
            external-dns-v6.txt
            external-health-*.json
            external-public-health.json
            external-public-health-delayed.json
            external-public-headers.txt
            external-public-redirect.txt
            external-public-root-delayed.html
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
          if-no-files-found: warn
          retention-days: 30

  production_acceptance:
    name: Verify authenticated production critical path evidence
    needs: external_acceptance
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      RELEASE_DIR: $HOME/.prosmet-greenfield/releases/${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Verify trusted Primary runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Aggregate authenticated critical path and external edge evidence
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          EVIDENCE_DIR="$RELEASE_DIR/production-evidence"
          test -d "$EVIDENCE_DIR"
          curl -fsS https://kolibriai.online/api/health > final-public-health.json
          grep -q "$RELEASE_SHA" final-public-health.json
          grep -q '"ui":"greenfield"' final-public-health.json
          curl -fsSI https://kolibriai.online/ > final-public-headers.txt
          grep -Eqi '^strict-transport-security:.*max-age=31536000' final-public-headers.txt
          cat > "$EVIDENCE_DIR/infrastructure.json" <<EOF
          {"survivedRunnerCleanup":true,"canonicalEdgeReloaded":true,"allResolvedIpv4Checked":true,"externalDns":true,"externalHttps":true,"publicRoot":true,"publicHealth":true,"runId":"${{ github.run_id }}"}
          EOF
          node scripts/verify-production-evidence.mjs "$EVIDENCE_DIR" "$RELEASE_SHA"
          cp "$EVIDENCE_DIR/production-critical-path-acceptance.json" production-acceptance.json
          cp -a "$EVIDENCE_DIR" production-evidence

      - name: Upload final production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-production-${{ github.run_id }}
          path: |
            production-acceptance.json
            final-public-health.json
            final-public-headers.txt
            production-evidence/**
          if-no-files-found: warn
          retention-days: 30
