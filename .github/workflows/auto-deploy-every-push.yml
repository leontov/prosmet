name: Prosmet Auto Deploy Every Push

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: prosmet-auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy exact pushed SHA
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Resolve exact deployment target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Start existing production deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run greenfield-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH"

      - name: Wait for deployment run of this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow greenfield-deploy.yml \
                --branch "$BRANCH" \
                --limit 30 \
                --json databaseId,headSha,status,conclusion,createdAt \
              | jq -r --arg sha "$SHA" '
                  [.[] | select(.headSha == $sha)]
                  | sort_by(.createdAt)
                  | last
                  | .databaseId // empty
                '
            )"

            if [ -n "$RUN_ID" ]; then
              echo "Watching deployment run $RUN_ID for SHA $SHA"
              gh run watch "$RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --exit-status
              exit $?
            fi

            sleep 5
          done

          echo "Timed out waiting for greenfield-deploy.yml run for SHA $SHA" >&2
          exit 1
