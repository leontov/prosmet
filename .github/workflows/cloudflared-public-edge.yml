name: Prosmet Cloudflare Tunnel Edge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflared-public-edge.yml"
  workflow_run:
    workflows: ["Prosmet Main Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-cloudflared-public-edge
  cancel-in-progress: true

jobs:
  publish:
    name: Publish exact release through rootless Cloudflare Tunnel
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    env:
      PROSMET_PUBLIC_DOMAIN: kolibriai.online
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
      TUNNEL_NAME: prosmet-kolibriai-online
    steps:
      - name: Verify trusted Primary runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME}" = "prosmet-primary"
          test -n "$RELEASE_SHA"
          echo "runner=$RUNNER_NAME"
          echo "release_sha=$RELEASE_SHA"

      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          clean: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Wait for exact application on port 3200
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/cloudflared artifacts/release "$HOME/.prosmet/cloudflared"
          chmod 0700 "$HOME/.prosmet/cloudflared"
          for attempt in $(seq 1 360); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3200/api/health > artifacts/release/internal-health.json 2>/dev/null && \
              grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/internal-health.json; then
              cat artifacts/release/internal-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Exact release ${RELEASE_SHA} did not become healthy on port 3200." >&2
          exit 1

      - name: Discover existing cloudflared identity without exposing secrets
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT=artifacts/cloudflared/discovery.txt
          CANDIDATES="$HOME/.prosmet/cloudflared/candidates.txt"
          : > "$REPORT"
          : > "$CANDIDATES"
          chmod 0600 "$CANDIDATES"

          binary=""
          while IFS= read -r pid; do
            test -n "$pid" || continue
            candidate="$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)"
            if [[ -x "$candidate" ]]; then
              binary="$candidate"
              break
            fi
          done < <(pgrep -x cloudflared 2>/dev/null || true)

          for candidate in \
            "$HOME/.kolibri/estimate-live/bin/cloudflared" \
            "$HOME/.local/bin/cloudflared" \
            "/usr/local/bin/cloudflared" \
            "/usr/bin/cloudflared"; do
            if [[ -z "$binary" && -x "$candidate" ]]; then
              binary="$candidate"
            fi
          done
          if [[ -z "$binary" ]] && command -v cloudflared >/dev/null 2>&1; then
            binary="$(command -v cloudflared)"
          fi
          if [[ -z "$binary" || ! -x "$binary" ]]; then
            echo "cloudflared executable is not available." | tee -a "$REPORT" >&2
            exit 1
          fi

          echo "CLOUDFLARED_BIN=$binary" >> "$GITHUB_ENV"
          {
            echo "binary=$binary"
            "$binary" --version 2>&1 | sed -E 's/(token[=: ]+)[^ ]+/\1<redacted>/Ig'
            echo "running_processes=$(pgrep -xc cloudflared 2>/dev/null || true)"
          } | tee -a "$REPORT"

          node --input-type=module <<'NODE' >> "$REPORT"
          import { readFile, readlink } from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          let pids = [];
          try {
            pids = execFileSync("pgrep", ["-x", "cloudflared"], { encoding: "utf8" })
              .trim().split(/\s+/).filter(Boolean);
          } catch {}
          for (const pid of pids) {
            let args = [];
            try {
              args = (await readFile(`/proc/${pid}/cmdline`)).toString("utf8").split("\0").filter(Boolean);
            } catch {}
            const safe = [];
            let redactNext = false;
            for (const arg of args) {
              if (redactNext) {
                safe.push("<redacted>");
                redactNext = false;
                continue;
              }
              if (/^--?(token|api-token|credentials-contents)$/i.test(arg)) {
                safe.push(arg);
                redactNext = true;
              } else if (/^--?(token|api-token|credentials-contents)=/i.test(arg)) {
                safe.push(arg.replace(/=.*/, "=<redacted>"));
              } else if (/^eyJ[A-Za-z0-9_-]{20,}/.test(arg)) {
                safe.push("<redacted-token>");
              } else {
                safe.push(arg);
              }
            }
            let exe = "";
            try { exe = await readlink(`/proc/${pid}/exe`); } catch {}
            console.log(`pid=${pid}`);
            console.log(`exe=${exe}`);
            console.log(`argv=${JSON.stringify(safe)}`);
            try {
              const names = (await readFile(`/proc/${pid}/environ`)).toString("utf8")
                .split("\0").filter(Boolean).map((item) => item.split("=", 1)[0])
                .filter((name) => /CLOUDFLARE|CLOUDFLARED|TUNNEL/i.test(name));
              console.log(`relevant_environment_names=${JSON.stringify(names)}`);
            } catch {}
          }
          NODE

          search_roots=(
            "$HOME/.cloudflared"
            "$HOME/.config/cloudflared"
            "$HOME/.config"
            "$HOME/.kolibri"
            "$HOME/.local/share"
            "/opt/kolibri"
            "/etc/cloudflared"
          )
          existing_roots=()
          for root in "${search_roots[@]}"; do
            [[ -d "$root" ]] && existing_roots+=("$root")
          done
          if ((${#existing_roots[@]})); then
            find "${existing_roots[@]}" -maxdepth 8 -type f -readable \
              \( -name 'cert.pem' -o -name 'config.yml' -o -name 'config.yaml' -o -name '*.json' \) \
              -print 2>/dev/null | sort -u > "$CANDIDATES"
          fi

          cert_file="$(grep -E '/cert\.pem$' "$CANDIDATES" | head -n 1 || true)"
          credential_count="$(node --input-type=module - "$CANDIDATES" <<'NODE'
          import { readFile } from "node:fs/promises";
          const list = process.argv[2];
          let count = 0;
          for (const path of (await readFile(list, "utf8")).split(/\r?\n/).filter(Boolean)) {
            if (!path.endsWith(".json")) continue;
            try {
              const value = JSON.parse(await readFile(path, "utf8"));
              if (value && typeof value === "object" && value.TunnelID && value.TunnelSecret) count++;
            } catch {}
          }
          process.stdout.write(String(count));
          NODE
          )"

          {
            echo "candidate_metadata_files=$(wc -l < "$CANDIDATES" | tr -d ' ')"
            echo "account_certificate_present=$([[ -n "$cert_file" ]] && echo true || echo false)"
            echo "tunnel_credential_files=$credential_count"
            echo "dns_a=$(getent ahostsv4 "$PROSMET_PUBLIC_DOMAIN" 2>/dev/null | awk 'NR==1 {print $1}' || true)"
            if command -v resolvectl >/dev/null 2>&1; then
              resolvectl query --type=NS "$PROSMET_PUBLIC_DOMAIN" 2>/dev/null | \
                sed -n '1,12p' || true
            fi
          } | tee -a "$REPORT"

          if [[ -n "$cert_file" ]]; then
            echo "CLOUDFLARED_CERT_FILE=$cert_file" >> "$GITHUB_ENV"
            echo "management_mode=account-certificate" | tee -a "$REPORT"
          else
            echo "management_mode=none" | tee -a "$REPORT"
          fi

      - name: Create or reuse a dedicated locally managed tunnel
        id: tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT=artifacts/cloudflared/tunnel.txt
          STATE="$HOME/.prosmet/cloudflared"
          CONFIG="$STATE/config.yml"
          LIST="$STATE/tunnels.json"
          mkdir -p "$STATE"
          chmod 0700 "$STATE"
          : > "$REPORT"

          if curl --fail --silent --show-error --max-time 15 \
            "https://${PROSMET_PUBLIC_DOMAIN}/api/health" > artifacts/release/preexisting-public-health.json 2>/dev/null && \
            grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/preexisting-public-health.json; then
            echo "mode=preexisting-exact-release" | tee -a "$REPORT"
            echo "mode=preexisting-exact-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${CLOUDFLARED_CERT_FILE:-}" || ! -r "$CLOUDFLARED_CERT_FILE" ]]; then
            echo "No readable Cloudflare account certificate was found; DNS cannot be moved to a named tunnel autonomously." | tee -a "$REPORT" >&2
            exit 1
          fi

          "$CLOUDFLARED_BIN" --origincert "$CLOUDFLARED_CERT_FILE" \
            tunnel list --output json > "$LIST"
          tunnel_id="$(node --input-type=module - "$LIST" "$TUNNEL_NAME" <<'NODE'
          import { readFile } from "node:fs/promises";
          const [file, name] = process.argv.slice(2);
          const rows = JSON.parse(await readFile(file, "utf8"));
          const match = Array.isArray(rows)
            ? rows.find((row) => row && row.name === name && !row.deleted_at)
            : null;
          if (match?.id) process.stdout.write(String(match.id));
          NODE
          )"

          if [[ -z "$tunnel_id" ]]; then
            "$CLOUDFLARED_BIN" --origincert "$CLOUDFLARED_CERT_FILE" \
              tunnel create "$TUNNEL_NAME" > "$STATE/create.log" 2>&1
            "$CLOUDFLARED_BIN" --origincert "$CLOUDFLARED_CERT_FILE" \
              tunnel list --output json > "$LIST"
            tunnel_id="$(node --input-type=module - "$LIST" "$TUNNEL_NAME" <<'NODE'
            import { readFile } from "node:fs/promises";
            const [file, name] = process.argv.slice(2);
            const rows = JSON.parse(await readFile(file, "utf8"));
            const match = Array.isArray(rows)
              ? rows.find((row) => row && row.name === name && !row.deleted_at)
              : null;
            if (match?.id) process.stdout.write(String(match.id));
            NODE
            )"
          fi
          [[ "$tunnel_id" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "Dedicated tunnel ID could not be resolved." >&2
            exit 1
          }

          credentials=""
          for candidate in \
            "$(dirname "$CLOUDFLARED_CERT_FILE")/${tunnel_id}.json" \
            "$HOME/.cloudflared/${tunnel_id}.json" \
            "$STATE/${tunnel_id}.json"; do
            if [[ -r "$candidate" ]]; then
              credentials="$candidate"
              break
            fi
          done
          if [[ -z "$credentials" ]]; then
            credentials="$(node --input-type=module - "$HOME/.prosmet/cloudflared/candidates.txt" "$tunnel_id" <<'NODE'
            import { readFile } from "node:fs/promises";
            const [list, wanted] = process.argv.slice(2);
            for (const path of (await readFile(list, "utf8")).split(/\r?\n/).filter(Boolean)) {
              if (!path.endsWith(".json")) continue;
              try {
                const value = JSON.parse(await readFile(path, "utf8"));
                if (String(value?.TunnelID || "") === wanted && value?.TunnelSecret) {
                  process.stdout.write(path);
                  break;
                }
              } catch {}
            }
            NODE
            )"
          fi
          [[ -n "$credentials" && -r "$credentials" ]] || {
            echo "Tunnel credentials file for ${tunnel_id} is missing." >&2
            exit 1
          }

          cat > "$CONFIG" <<YAML
          tunnel: ${tunnel_id}
          credentials-file: ${credentials}
          metrics: 127.0.0.1:20242
          no-autoupdate: true
          ingress:
            - hostname: ${PROSMET_PUBLIC_DOMAIN}
              service: http://127.0.0.1:3200
            - service: http_status:404
          YAML
          chmod 0600 "$CONFIG"

          "$CLOUDFLARED_BIN" --config "$CONFIG" tunnel ingress validate

          route_args=(
            --origincert "$CLOUDFLARED_CERT_FILE"
            tunnel route dns
          )
          if "$CLOUDFLARED_BIN" tunnel route dns --help 2>&1 | grep -q -- '--overwrite-dns'; then
            route_args+=(--overwrite-dns)
          fi
          route_args+=("$tunnel_id" "$PROSMET_PUBLIC_DOMAIN")
          "$CLOUDFLARED_BIN" "${route_args[@]}" > "$STATE/dns-route.log" 2>&1

          if [[ -s "$STATE/edge.pid" ]]; then
            old_pid="$(cat "$STATE/edge.pid" 2>/dev/null || true)"
            if [[ "$old_pid" =~ ^[0-9]+$ ]] && kill -0 "$old_pid" 2>/dev/null; then
              kill "$old_pid" 2>/dev/null || true
              sleep 2
              kill -9 "$old_pid" 2>/dev/null || true
            fi
          fi
          : > "$STATE/edge.log"
          chmod 0600 "$STATE/edge.log"
          nohup env -u RUNNER_TRACKING_ID \
            "$CLOUDFLARED_BIN" --no-autoupdate --config "$CONFIG" tunnel run "$tunnel_id" \
            > "$STATE/edge.log" 2>&1 < /dev/null &
          edge_pid=$!
          printf '%s\n' "$edge_pid" > "$STATE/edge.pid"
          chmod 0600 "$STATE/edge.pid"

          sleep 3
          kill -0 "$edge_pid"
          {
            echo "mode=locally-managed-cloudflare-tunnel"
            echo "tunnel_name=$TUNNEL_NAME"
            echo "tunnel_id=$tunnel_id"
            echo "connector_pid=$edge_pid"
          } | tee -a "$REPORT"
          echo "mode=locally-managed-cloudflare-tunnel" >> "$GITHUB_OUTPUT"
          echo "tunnel_id=$tunnel_id" >> "$GITHUB_OUTPUT"

      - name: Verify exact public HTTPS release
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE="$HOME/.prosmet/cloudflared"
          for attempt in $(seq 1 450); do
            if curl --fail --silent --show-error --max-time 20 \
              "https://${PROSMET_PUBLIC_DOMAIN}/api/health" > artifacts/release/public-health.json 2>/dev/null && \
              grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/public-health.json; then
              curl --fail --silent --show-error --head --max-time 20 \
                "https://${PROSMET_PUBLIC_DOMAIN}/" > artifacts/release/public-headers.txt
              cat artifacts/release/public-health.json
              cat artifacts/release/public-headers.txt
              exit 0
            fi
            if [[ -s "$STATE/edge.pid" ]]; then
              pid="$(cat "$STATE/edge.pid" 2>/dev/null || true)"
              if [[ "$pid" =~ ^[0-9]+$ ]] && ! kill -0 "$pid" 2>/dev/null; then
                tail -n 200 "$STATE/edge.log" >&2 || true
                exit 1
              fi
            fi
            sleep 2
          done
          tail -n 200 "$STATE/edge.log" >&2 || true
          echo "Public DNS or tunnel did not serve exact release ${RELEASE_SHA} in time." >&2
          exit 1

      - name: Copy rootless edge evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE="$HOME/.prosmet/cloudflared"
          cp "$STATE/dns-route.log" artifacts/cloudflared/dns-route.log 2>/dev/null || true
          cp "$STATE/edge.log" artifacts/cloudflared/edge.log 2>/dev/null || true
          if [[ -s "$STATE/config.yml" ]]; then
            sed -E 's#(credentials-file:).*#\1 <redacted-path>#' "$STATE/config.yml" \
              > artifacts/cloudflared/config-redacted.yml
          fi

      - name: Upload Cloudflare edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-cloudflared-edge-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Publish rootless edge status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FINAL_STATUS: ${{ job.status }}
          EDGE_MODE: ${{ steps.tunnel.outputs.mode }}
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
        with:
          script: |
            const success = process.env.FINAL_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `CLOUDFLARED EDGE ${success ? "PASS" : "FAILED"}`,
                `Commit: \`${process.env.RELEASE_SHA}\``,
                `Runner: \`prosmet-primary\``,
                `Mode: \`${process.env.EDGE_MODE || "not-established"}\``,
                process.env.TUNNEL_ID ? `Tunnel: \`${process.env.TUNNEL_ID}\`` : "Tunnel: not available",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                process.env.SOURCE_RUN_URL ? `Production run: ${process.env.SOURCE_RUN_URL}` : "Production run: direct push/manual",
                success
                  ? "APP: https://kolibriai.online/"
                  : "No secret was printed. Inspect the discovery artifact to determine whether account-level Cloudflare credentials exist."
              ].join("\n\n")
            });
