name: Apply Database-First Estimate Refactor

on:
  push:
    branches: [feature/database-first-estimates-v1]

permissions:
  contents: write

concurrency:
  group: prosmet-database-first-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/database-first-estimates-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Apply exact source transformation
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/apply-database-first-refactor.mjs';
          let source = await readFile(path, 'utf8');
          source = source.replace(/\n  contract = replaceOnce\(\n    contract,\n    '  persistence: [\s\S]*?\n    "noop guard"\n  \);/, '');
          await writeFile(path, source, 'utf8');
          NODE
          node scripts/apply-database-first-refactor.mjs

      - name: Commit materialized product sources
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: make AI estimates database-first artifacts"
          git push origin HEAD:feature/database-first-estimates-v1
