name: Patch rootless PostgreSQL initdb

on:
  push:
    branches: [rebuild/server-postgres-indexeddb]
    paths:
      - .github/workflows/patch-waldir.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/server-postgres-indexeddb
          fetch-depth: 0

      - name: Remove invalid in-cluster WAL symlink option
        run: |
          set -Eeuo pipefail
          sed -i '/^[[:space:]]*--waldir=/d' deployment/provision-postgres.sh
          rm -f .github/workflows/patch-waldir.yml

      - name: Commit the exact patch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/provision-postgres.sh .github/workflows/patch-waldir.yml
          git commit -m "fix(database): let initdb create its own WAL directory"
          git push origin HEAD:rebuild/server-postgres-indexeddb
