name: Prosmet Production Run Watchdog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  CURRENT_SHA: ${{ github.sha }}
  CURRENT_RUN: ${{ github.run_id }}

jobs:
  cancel-stale-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel older production runs for previous SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/greenfield-deploy.yml/runs?branch=main&per_page=100" \
            | jq -r --arg current_run "$CURRENT_RUN" --arg current_sha "$CURRENT_SHA" '
                .workflow_runs[]
                | select((.id | tostring) != $current_run)
                | select(.head_sha != $current_sha)
                | select(.status != "completed")
                | [.id, .status, .head_sha]
                | @tsv
              ' > stale-production-runs.tsv

          while IFS=$'\t' read -r run_id status head_sha; do
            [ -n "${run_id:-}" ] || continue
            echo "Cancelling stale production run ${run_id} (${status}, ${head_sha})"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done < stale-production-runs.tsv
