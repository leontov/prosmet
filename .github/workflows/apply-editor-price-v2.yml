name: Verify Estimate Editor V2 source is visible

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-editor-price-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prosmet-editor-price-v2-apply
  cancel-in-progress: true

jobs:
  verify-visible-source:
    name: Verify source is committed directly to main
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Verify Primary runner
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          test "${GITHUB_REF_NAME}" = "main"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Report direct-source status
        run: |
          set -Eeuo pipefail
          echo "Editor V2 and Price Intelligence are being committed as ordinary source files on main."
          test -s lib/domain/price-intelligence.ts
          test -s lib/local/idb.ts
