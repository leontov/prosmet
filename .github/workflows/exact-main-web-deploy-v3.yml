name: ProSmet Exact Main Web Deploy V3

on:
  push:
    branches: [ops/exact-main-web-deploy-v3]

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-exact-main-web-deploy-v3
  cancel-in-progress: false

env:
  CI: "true"
  RELEASE_SHA: aee966c356377be3d2e676679912bd705907c1ae
  PRODUCTION_ORIGIN: https://kolibriai.online

jobs:
  deploy:
    name: Build and activate exact main on prosmet-primary
    runs-on: [self-hosted]
    timeout-minutes: 90
    steps:
      - name: Verify trusted Primary runner
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'runner=%s\nos=%s\narch=%s\nhost=%s\nuser=%s\n' \
            "${{ runner.name }}" "${{ runner.os }}" "${{ runner.arch }}" "$(hostname -s)" "$(id -un)"
          test "${{ runner.name }}" = "prosmet-primary"
          test "${{ runner.os }}" = "Linux"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install and verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata
          npx playwright install chromium
          npm run e2e

      - name: Install immutable release payload
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_DIR="$HOME/.prosmet-greenfield/releases/${RELEASE_SHA}-${GITHUB_RUN_ID}"
          CONFIG_ROOT="$HOME/.prosmet-greenfield/config"
          printf 'RELEASE_DIR=%s\n' "$RELEASE_DIR" >> "$GITHUB_ENV"
          printf 'CONFIG_ROOT=%s\n' "$CONFIG_ROOT" >> "$GITHUB_ENV"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR" "$CONFIG_ROOT"
          chmod 700 "$HOME/.prosmet-greenfield" "$CONFIG_ROOT"
          cp -a apps/web/dist "$RELEASE_DIR/dist"
          cp apps/web/server.mjs "$RELEASE_DIR/server.mjs"
          cp deployment/ensure-public-edge.sh "$RELEASE_DIR/ensure-public-edge.sh"
          chmod 0755 "$RELEASE_DIR/ensure-public-edge.sh"
          printf '%s\n' "$RELEASE_SHA" > "$RELEASE_DIR/SHA"
          cat > "$RELEASE_DIR/release.json" <<EOF
          {"releaseSha":"$RELEASE_SHA","repository":"${{ github.repository }}","runId":"${{ github.run_id }}","exactMain":true,"webVisualRelease":true}
          EOF
          test -s "$RELEASE_DIR/dist/index.html"
          grep -Fq '<div id="root"></div>' "$RELEASE_DIR/dist/index.html"

      - name: Preflight candidate and atomically switch port 3200
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE_PORT=33201
          PID_FILE="$HOME/.prosmet-greenfield/production.pid"
          LOG_FILE="$HOME/.prosmet-greenfield/production.log"
          CANDIDATE_PID_FILE="$HOME/.prosmet-greenfield/candidate-${GITHUB_RUN_ID}.pid"
          CANDIDATE_LOG="$HOME/.prosmet-greenfield/candidate-${GITHUB_RUN_ID}.log"

          if command -v ss >/dev/null 2>&1 && ss -H -ltn "sport = :$CANDIDATE_PORT" | grep -q .; then
            echo "Candidate port $CANDIDATE_PORT is already occupied" >&2
            exit 1
          fi

          OLD_PID=""
          OLD_DIR=""
          OLD_SHA=""
          if [ -s "$PID_FILE" ]; then
            candidate="$(cat "$PID_FILE" 2>/dev/null || true)"
            if printf '%s' "$candidate" | grep -Eq '^[0-9]+$' && kill -0 "$candidate" 2>/dev/null; then
              OLD_PID="$candidate"
              OLD_DIR="$(readlink -f "/proc/$OLD_PID/cwd" 2>/dev/null || true)"
              if [ -n "$OLD_DIR" ] && [ -s "$OLD_DIR/SHA" ]; then OLD_SHA="$(cat "$OLD_DIR/SHA")"; fi
            fi
          fi
          printf 'OLD_PID=%s\nOLD_DIR=%s\nOLD_SHA=%s\n' "$OLD_PID" "$OLD_DIR" "$OLD_SHA" > rollback-state.txt

          start_release() {
            local release_dir="$1"
            local release_sha="$2"
            local port="$3"
            local log_file="$4"
            local pid_file="$5"
            cd "$release_dir"
            nohup env -u RUNNER_TRACKING_ID \
              PORT="$port" \
              PROSMET_RELEASE_SHA="$release_sha" \
              PROSMET_CONFIG_DIR="$CONFIG_ROOT" \
              PROSMET_PUBLIC_AGENT_ACCESS=true \
              node server.mjs \
              </dev/null > "$log_file" 2>&1 &
            local pid=$!
            disown "$pid" 2>/dev/null || true
            printf '%s\n' "$pid" > "$pid_file"
          }

          wait_release() {
            local port="$1"
            local release_sha="$2"
            local attempts="$3"
            for attempt in $(seq 1 "$attempts"); do
              root_status="$(curl --silent --show-error --output "/tmp/prosmet-root-${port}.html" --write-out '%{http_code}' "http://127.0.0.1:${port}/" || true)"
              health_status="$(curl --silent --show-error --output "/tmp/prosmet-health-${port}.json" --write-out '%{http_code}' "http://127.0.0.1:${port}/api/health" || true)"
              if [ "$root_status" = "200" ] && [ "$health_status" = "200" ] \
                && grep -Fq '<div id="root"></div>' "/tmp/prosmet-root-${port}.html" \
                && grep -q "$release_sha" "/tmp/prosmet-health-${port}.json" \
                && grep -q '"ui":"greenfield"' "/tmp/prosmet-health-${port}.json"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          rm -f "$CANDIDATE_PID_FILE" "$CANDIDATE_LOG"
          start_release "$RELEASE_DIR" "$RELEASE_SHA" "$CANDIDATE_PORT" "$CANDIDATE_LOG" "$CANDIDATE_PID_FILE"
          CANDIDATE_PID="$(cat "$CANDIDATE_PID_FILE")"
          if ! wait_release "$CANDIDATE_PORT" "$RELEASE_SHA" 60; then
            cat "$CANDIDATE_LOG" >&2 || true
            kill "$CANDIDATE_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$CANDIDATE_PID" 2>/dev/null || true
          sleep 1
          kill -9 "$CANDIDATE_PID" 2>/dev/null || true

          if [ -n "$OLD_PID" ]; then
            kill "$OLD_PID" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              kill -0 "$OLD_PID" 2>/dev/null || break
              sleep 0.25
            done
            kill -9 "$OLD_PID" 2>/dev/null || true
          fi
          if command -v fuser >/dev/null 2>&1; then fuser -k 3200/tcp || true; fi
          if command -v lsof >/dev/null 2>&1; then
            PIDS="$(lsof -tiTCP:3200 -sTCP:LISTEN || true)"
            if [ -n "$PIDS" ]; then kill $PIDS || true; fi
          fi

          rm -f "$PID_FILE"
          start_release "$RELEASE_DIR" "$RELEASE_SHA" 3200 "$LOG_FILE" "$PID_FILE"
          NEW_PID="$(cat "$PID_FILE")"

          rollback() {
            kill "$NEW_PID" 2>/dev/null || true
            if [ -n "$OLD_DIR" ] && [ -n "$OLD_SHA" ] && [ -s "$OLD_DIR/server.mjs" ]; then
              start_release "$OLD_DIR" "$OLD_SHA" 3200 "$HOME/.prosmet-greenfield/rollback.log" "$PID_FILE"
              wait_release 3200 "$OLD_SHA" 60 || cat "$HOME/.prosmet-greenfield/rollback.log" >&2 || true
            fi
          }

          if ! wait_release 3200 "$RELEASE_SHA" 90; then
            cat "$LOG_FILE" >&2 || true
            rollback
            exit 1
          fi
          if tr '\0' '\n' < "/proc/$NEW_PID/environ" | grep -q '^RUNNER_TRACKING_ID='; then
            echo "Persistent process inherited RUNNER_TRACKING_ID" >&2
            rollback
            exit 1
          fi

          ln -sfn "$RELEASE_DIR" "$HOME/.prosmet-greenfield/current.next"
          mv -Tf "$HOME/.prosmet-greenfield/current.next" "$HOME/.prosmet-greenfield/current"
          cp /tmp/prosmet-health-3200.json local-health.json
          cp /tmp/prosmet-root-3200.html local-root.html

      - name: Reconcile canonical HTTPS edge and verify exact public SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          PROSMET_EXPECTED_RELEASE_SHA="$RELEASE_SHA" \
            bash "$RELEASE_DIR/ensure-public-edge.sh" kolibriai.online 3200
          cp "$HOME/.prosmet/caddy/status.json" edge-status.json
          cp "$HOME/.prosmet/caddy/edge-diagnostics.txt" edge-diagnostics.txt 2>/dev/null || true

          for attempt in $(seq 1 60); do
            root_status="$(curl --silent --show-error --output public-root.html --dump-header public-root-headers.txt --write-out '%{http_code}' "$PRODUCTION_ORIGIN/" || true)"
            health_status="$(curl --silent --show-error --output public-health.json --dump-header public-health-headers.txt --write-out '%{http_code}' "$PRODUCTION_ORIGIN/api/health" || true)"
            if [ "$root_status" = "200" ] && [ "$health_status" = "200" ] \
              && grep -Fq '<div id="root"></div>' public-root.html \
              && grep -q "$RELEASE_SHA" public-health.json \
              && grep -q '"ui":"greenfield"' public-health.json; then
              exit 0
            fi
            sleep 2
          done
          cat public-root-headers.txt public-health-headers.txt public-health.json || true
          exit 1

      - name: Upload Primary deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prosmet-exact-main-v3-primary-${{ github.run_id }}
          path: |
            rollback-state.txt
            local-root.html
            local-health.json
            public-root.html
            public-root-headers.txt
            public-health.json
            public-health-headers.txt
            edge-status.json
            edge-diagnostics.txt
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
          if-no-files-found: warn
          retention-days: 30

  persistence:
    name: Verify process and edge after runner cleanup
    needs: deploy
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: Verify trusted Primary and persistent exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          sleep 8
          PID_FILE="$HOME/.prosmet-greenfield/production.pid"
          test -s "$PID_FILE"
          PID="$(cat "$PID_FILE")"
          kill -0 "$PID"
          if tr '\0' '\n' < "/proc/$PID/environ" | grep -q '^RUNNER_TRACKING_ID='; then
            echo "Persistent process unexpectedly contains RUNNER_TRACKING_ID" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:3200/api/health > local-health-post-cleanup.json
          grep -q "$RELEASE_SHA" local-health-post-cleanup.json
          curl -fsS "$PRODUCTION_ORIGIN/api/health" > public-health-post-cleanup.json
          grep -q "$RELEASE_SHA" public-health-post-cleanup.json
          curl -fsS "$PRODUCTION_ORIGIN/" > public-root-post-cleanup.html
          grep -Fq '<div id="root"></div>' public-root-post-cleanup.html

      - name: Upload persistence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prosmet-exact-main-v3-persistence-${{ github.run_id }}
          path: |
            local-health-post-cleanup.json
            public-health-post-cleanup.json
            public-root-post-cleanup.html
          if-no-files-found: warn
          retention-days: 30

  external:
    name: Verify exact release from external hosted runner
    needs: persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - name: Verify every resolved public IPv4
        shell: bash
        run: |
          set -Eeuo pipefail
          getent ahostsv4 kolibriai.online | tee external-dns-v4.txt
          mapfile -t ADDRESSES < <(awk '{print $1}' external-dns-v4.txt | sort -u)
          test "${#ADDRESSES[@]}" -gt 0
          for address in "${ADDRESSES[@]}"; do
            safe="${address//./-}"
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
              --resolve "kolibriai.online:443:${address}" \
              "$PRODUCTION_ORIGIN/" > "external-root-${safe}.html"
            grep -Fq '<div id="root"></div>' "external-root-${safe}.html"
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
              --resolve "kolibriai.online:443:${address}" \
              "$PRODUCTION_ORIGIN/api/health" > "external-health-${safe}.json"
            grep -q "$RELEASE_SHA" "external-health-${safe}.json"
            grep -q '"ui":"greenfield"' "external-health-${safe}.json"
          done

      - name: Run live desktop and mobile Chromium acceptance
        env:
          PROSMET_BASE_URL: https://kolibriai.online
          PROSMET_CRITICAL_PATH: "false"
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Delayed external persistence probe
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 30
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            "$PRODUCTION_ORIGIN/api/health" > external-health-delayed.json
          grep -q "$RELEASE_SHA" external-health-delayed.json
          grep -q '"ui":"greenfield"' external-health-delayed.json
          curl --fail --silent --show-error "$PRODUCTION_ORIGIN/" > external-root-delayed.html
          grep -Fq '<div id="root"></div>' external-root-delayed.html

      - name: Upload external evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prosmet-exact-main-v3-external-${{ github.run_id }}
          path: |
            external-dns-v4.txt
            external-root-*.html
            external-health-*.json
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Publish immutable production result
    if: always()
    needs: [deploy, persistence, external]
    runs-on: ubuntu-24.04
    steps:
      - name: Write exact result to production ledger
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence.result }}
          EXTERNAL_RESULT: ${{ needs.external.result }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        with:
          script: |
            const passed = process.env.DEPLOY_RESULT === "success"
              && process.env.PERSISTENCE_RESULT === "success"
              && process.env.EXTERNAL_RESULT === "success";
            const body = [
              `## ${passed ? "✅ EXACT-MAIN WEB PRODUCTION PASS" : "❌ EXACT-MAIN WEB PRODUCTION FAIL"}`,
              "",
              `- Release SHA: \`${process.env.RELEASE_SHA}\``,
              `- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Primary deployment: \`${process.env.DEPLOY_RESULT}\``,
              `- Post-cleanup persistence: \`${process.env.PERSISTENCE_RESULT}\``,
              `- External IPv4 and Chromium acceptance: \`${process.env.EXTERNAL_RESULT}\``,
              `- Public service: https://kolibriai.online`,
              `- Health endpoint: https://kolibriai.online/api/health`,
              "",
              passed
                ? "The exact merged web release is installed on prosmet-primary, survives runner cleanup, is exposed through the canonical HTTPS edge, serves the same SHA on every resolved public IPv4, and passes live desktop/mobile Chromium acceptance plus a delayed persistence probe."
                : "The exact-main release was not fully accepted. Inspect the linked run before treating this SHA as deployed."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 53,
              body
            });
