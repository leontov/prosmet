name: bootstrap-source

on:
  pull_request:
    branches:
      - bootstrap-base/chat-first-estimating-office

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: feature/chat-first-estimating-office
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part* > /tmp/prosmet-source.b64
          base64 --decode /tmp/prosmet-source.b64 > /tmp/prosmet-source.tar.gz
          echo "be19de4d0ddae384c1fbbd56ff68a892590919dee4c8831e104200b7b2bc5382  /tmp/prosmet-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prosmet-source.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/primary-ci.yml

      - name: Publish normal source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish"
            exit 0
          fi
          git commit -m "feat: build chat-first estimating office vertical slice"
          git push origin "HEAD:feature/chat-first-estimating-office"
