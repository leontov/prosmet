name: Prosmet HTTPS Edge Recovery

on:
  workflow_run:
    workflows: ["Prosmet Main Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-https-edge
  cancel-in-progress: true

jobs:
  recover:
    name: Recover public HTTPS edge on Primary
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      PROSMET_PUBLIC_DOMAIN: kolibriai.online
      PROSMET_PUBLIC_IP: 78.17.4.108
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
    steps:
      - name: Verify trusted runner and release identity
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          test -n "$RELEASE_SHA"
          echo "release_sha=$RELEASE_SHA"
          echo "source_run=${SOURCE_RUN_URL:-manual}"

      - name: Checkout exact deployed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          clean: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Recover low-port HTTPS edge after deployment
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/https artifacts/release
          export PROSMET_EXPECTED_RELEASE_SHA="$RELEASE_SHA"
          bash deployment/recover-https-edge.sh "$PROSMET_PUBLIC_DOMAIN" 3200 \
            2>&1 | tee artifacts/https/recovery.log
          cp "$HOME/.prosmet/caddy/status.json" artifacts/https/status.json
          cp "$HOME/.prosmet/caddy/Caddyfile" artifacts/https/Caddyfile
          cp "$HOME/.prosmet/caddy/privilege-diagnostics.txt" artifacts/https/privilege-diagnostics.txt 2>/dev/null || true
          cp "$HOME/.prosmet/caddy/https-headers.txt" artifacts/https/https-headers.txt
          cp "$HOME/.prosmet/caddy/http-redirect-headers.txt" artifacts/https/http-redirect-headers.txt

      - name: Verify exact public domain release
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://${PROSMET_PUBLIC_DOMAIN}/api/health" | tee artifacts/release/public-health.json
          grep -q '"ok":true' artifacts/release/public-health.json
          grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/public-health.json
          curl --fail --silent --show-error --head --max-time 20 \
            "https://${PROSMET_PUBLIC_DOMAIN}/" | tee artifacts/release/public-headers.txt
          grep -qi '^strict-transport-security:.*max-age=31536000' artifacts/release/public-headers.txt

      - name: Upload HTTPS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-https-edge-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Publish edge status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FINAL_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.FINAL_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `HTTPS EDGE ${success ? "PASS" : "FAILED"}`,
                `Commit: \`${process.env.RELEASE_SHA}\``,
                `Runner: \`prosmet-primary\``,
                `Recovery run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                process.env.SOURCE_RUN_URL ? `Production run: ${process.env.SOURCE_RUN_URL}` : "Production run: manual recovery",
                success ? "APP: https://kolibriai.online/" : "Inspect the uploaded privilege diagnostics."
              ].join("\n\n")
            });
