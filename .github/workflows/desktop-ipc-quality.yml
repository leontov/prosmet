name: ProSmet Desktop IPC Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "crates/estimate-engine/**"
      - "packages/contracts/**"
      - "scripts/desktop-ipc-contract.mjs"
      - "docs/architecture/desktop-ipc-foundation-v1.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-ipc-quality.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "crates/estimate-engine/**"
      - "packages/contracts/**"
      - "scripts/desktop-ipc-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-ipc-quality.yml"

permissions:
  contents: read

concurrency:
  group: prosmet-desktop-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      PROSMET_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Install Tauri Linux dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf wget

      - name: Install clean JavaScript workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Desktop IPC source and capability contract
        run: npm run desktop:security

      - name: Shared contracts, TypeScript, unit tests and web build
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Rust format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: |
          set -o pipefail
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build unsigned Linux desktop packages
        run: npm run desktop:build

      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prosmet-desktop-linux-${{ github.run_id }}
          path: |
            clippy.log
            target/release/bundle
            target/release/prosmet-desktop
          if-no-files-found: warn
          retention-days: 14
