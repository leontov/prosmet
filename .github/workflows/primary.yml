name: Prosmet Primary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-primary-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and deploy on prosmet-primary
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 100
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: ${{ vars.PROSMET_DEFAULT_PROVIDER || 'rules' }}
      DEPLOY_PORT: "3200"
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      MIMO_BASE_URL: ${{ vars.MIMO_BASE_URL }}
      MIMO_MODEL: ${{ vars.MIMO_MODEL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
    steps:
      - name: Verify runner identity
        id: runner
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }} / ${{ runner.arch }}"
          test "${{ runner.name }}" = "prosmet-primary"

      - name: Checkout
        id: checkout
        if: steps.runner.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Node 22
        id: node
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Prepare evidence
        if: steps.node.outcome == 'success'
        run: mkdir -p artifacts/logs artifacts/screenshots

      - name: Create lockfile when repository is freshly initialized
        id: lockfile
        if: steps.node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies
        id: install
        if: steps.lockfile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee artifacts/logs/npm-ci.log

      - name: Source contract
        id: source_contract
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run source:contract 2>&1 | tee artifacts/logs/source-contract.log

      - name: TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log

      - name: Unit tests
        id: unit_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee artifacts/logs/unit-tests.log

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/logs/build.log

      - name: Prepare Docker and verification PostgreSQL
        id: verification_database
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -Eeuo pipefail
            if ! command -v docker >/dev/null 2>&1; then
              sudo -n apt-get update
              sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
              sudo -n systemctl enable --now docker
            fi
            if docker info >/dev/null 2>&1; then
              DOCKER=(docker)
            elif sudo -n docker info >/dev/null 2>&1; then
              DOCKER=(sudo -n docker)
            else
              echo "Runner cannot access Docker" >&2
              exit 1
            fi
            "${DOCKER[@]}" rm -f prosmet-e2e-postgres >/dev/null 2>&1 || true
            "${DOCKER[@]}" pull postgres:16-alpine
            "${DOCKER[@]}" run -d \
              --name prosmet-e2e-postgres \
              -e POSTGRES_DB=prosmet \
              -e POSTGRES_USER=prosmet \
              -e POSTGRES_PASSWORD=prosmet-e2e \
              -p 127.0.0.1::5432 \
              --health-cmd='pg_isready -U prosmet -d prosmet' \
              --health-interval=3s \
              --health-timeout=3s \
              --health-retries=20 \
              postgres:16-alpine
            PORT="$("${DOCKER[@]}" port prosmet-e2e-postgres 5432/tcp | awk -F: 'END {print $NF}')"
            test -n "$PORT"
            echo "DATABASE_URL=postgresql://prosmet:prosmet-e2e@127.0.0.1:${PORT}/prosmet" >> "$GITHUB_ENV"
            for attempt in $(seq 1 40); do
              STATUS="$("${DOCKER[@]}" inspect -f '{{.State.Health.Status}}' prosmet-e2e-postgres 2>/dev/null || true)"
              if [ "$STATUS" = healthy ]; then
                echo "Verification PostgreSQL healthy on port ${PORT}"
                exit 0
              fi
              sleep 2
            done
            "${DOCKER[@]}" logs prosmet-e2e-postgres || true
            exit 1
          ) 2>&1 | tee artifacts/logs/verification-postgres.log

      - name: Install Playwright Chromium
        id: chromium
        if: steps.verification_database.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee artifacts/logs/chromium.log

      - name: Desktop and mobile Chromium E2E
        id: e2e
        if: steps.build.outcome == 'success' && steps.verification_database.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee artifacts/logs/e2e.log

      - name: Stop verification PostgreSQL
        if: always()
        shell: bash
        run: |
          if docker info >/dev/null 2>&1; then
            docker rm -f prosmet-e2e-postgres >/dev/null 2>&1 || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo -n docker rm -f prosmet-e2e-postgres >/dev/null 2>&1 || true
          fi

      - name: Build immutable production image
        id: image
        if: steps.source_contract.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.build.outcome == 'success' && steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "Runner cannot access Docker" >&2
            exit 1
          fi
          "${DOCKER[@]}" build --pull -t "prosmet:${GITHUB_SHA}" .
          "${DOCKER[@]}" tag "prosmet:${GITHUB_SHA}" prosmet:latest

      - name: Deploy canary app, backend and PostgreSQL
        id: canary
        if: steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deployment/primary-stack.sh canary "prosmet:${GITHUB_SHA}" 13100
          cp /opt/prosmet/prosmet-canary-health.json artifacts/canary-health.json
          cp /opt/prosmet/prosmet-canary-backend.json artifacts/canary-backend.json
          cp /opt/prosmet/prosmet-canary-agent.sse artifacts/canary-agent.sse

      - name: Promote frontend, backend and PostgreSQL to Primary
        id: deploy
        if: steps.canary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          else
            DOCKER=(sudo -n docker)
          fi
          if command -v ss >/dev/null 2>&1 && ss -H -ltn "sport = :${DEPLOY_PORT}" | grep -q .; then
            if ! "${DOCKER[@]}" inspect prosmet >/dev/null 2>&1; then
              echo "Port ${DEPLOY_PORT} is occupied by another service. Prosmet will not replace it."
              exit 1
            fi
          fi
          bash deployment/primary-stack.sh primary "prosmet:${GITHUB_SHA}" "${DEPLOY_PORT}"
          "${DOCKER[@]}" rm -f prosmet-canary >/dev/null 2>&1 || true
          cp /opt/prosmet/prosmet-health.json artifacts/primary-health.json
          cp /opt/prosmet/prosmet-backend.json artifacts/primary-backend.json
          cp /opt/prosmet/prosmet-agent.sse artifacts/primary-agent.sse

      - name: Write release evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/release.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "runner": "${{ runner.name }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "http://78.17.4.108:${DEPLOY_PORT}/",
            "health": "http://78.17.4.108:${DEPLOY_PORT}/api/health",
            "backendStatus": "http://78.17.4.108:${DEPLOY_PORT}/api/backend/status",
            "agent": "http://78.17.4.108:${DEPLOY_PORT}/api/agent",
            "sync": "http://78.17.4.108:${DEPLOY_PORT}/api/sync",
            "image": "prosmet:${GITHUB_SHA}",
            "gate": "${{ steps.deploy.outcome }}"
          }
          JSON

      - name: Upload browser, logs and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-primary-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish observable Primary status
        if: always()
        uses: actions/github-script@v7
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_GATE: ${{ steps.runner.outcome }}
          CHECKOUT_GATE: ${{ steps.checkout.outcome }}
          LOCKFILE_GATE: ${{ steps.lockfile.outcome }}
          INSTALL_GATE: ${{ steps.install.outcome }}
          SOURCE_GATE: ${{ steps.source_contract.outcome }}
          TYPE_GATE: ${{ steps.typecheck.outcome }}
          UNIT_GATE: ${{ steps.unit_tests.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          POSTGRES_GATE: ${{ steps.verification_database.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
          E2E_GATE: ${{ steps.e2e.outcome }}
          IMAGE_GATE: ${{ steps.image.outcome }}
          CANARY_GATE: ${{ steps.canary.outcome }}
          DEPLOY_GATE: ${{ steps.deploy.outcome }}
        with:
          script: |
            const title = "[Prosmet Primary] Deployment status";
            const checks = [
              ["runner prosmet-primary", process.env.RUNNER_GATE],
              ["checkout", process.env.CHECKOUT_GATE],
              ["lockfile", process.env.LOCKFILE_GATE],
              ["npm ci", process.env.INSTALL_GATE],
              ["source contract", process.env.SOURCE_GATE],
              ["typecheck", process.env.TYPE_GATE],
              ["unit tests", process.env.UNIT_GATE],
              ["production build", process.env.BUILD_GATE],
              ["verification PostgreSQL", process.env.POSTGRES_GATE],
              ["Chromium", process.env.CHROMIUM_GATE],
              ["desktop/mobile Chromium E2E", process.env.E2E_GATE],
              ["Docker image", process.env.IMAGE_GATE],
              ["canary app/backend/PostgreSQL", process.env.CANARY_GATE],
              ["Primary app/backend/PostgreSQL", process.env.DEPLOY_GATE]
            ];
            const icon = (value) => value === "success" ? "✅" : value === "skipped" ? "⏭️" : "❌";
            const body = [
              `**Commit:** \`${context.sha}\``,
              `**Runner:** \`${process.env.RUNNER_NAME}\``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Updated:** ${new Date().toISOString()}`,
              "",
              "| Gate | Result |",
              "|---|---|",
              ...checks.map(([name, value]) => `| ${name} | ${icon(value)} ${value || "not-run"} |`),
              "",
              process.env.DEPLOY_GATE === "success"
                ? "**LIVE:** http://78.17.4.108:3200/\n\n**BACKEND:** http://78.17.4.108:3200/api/backend/status"
                : "Deployment is blocked until every required gate passes."
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Show logs on failure
        if: always() && steps.deploy.outcome != 'success'
        shell: bash
        run: |
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            exit 0
          fi
          "${DOCKER[@]}" logs prosmet-canary 2>/dev/null || true
          "${DOCKER[@]}" logs prosmet 2>/dev/null || true
          "${DOCKER[@]}" logs prosmet-postgres 2>/dev/null || true

      - name: Enforce green release gate
        if: always()
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.runner.outcome }}
          INSTALL_GATE: ${{ steps.install.outcome }}
          SOURCE_GATE: ${{ steps.source_contract.outcome }}
          TYPE_GATE: ${{ steps.typecheck.outcome }}
          UNIT_GATE: ${{ steps.unit_tests.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          POSTGRES_GATE: ${{ steps.verification_database.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
          E2E_GATE: ${{ steps.e2e.outcome }}
          IMAGE_GATE: ${{ steps.image.outcome }}
          CANARY_GATE: ${{ steps.canary.outcome }}
          DEPLOY_GATE: ${{ steps.deploy.outcome }}
        run: |
          set -Eeuo pipefail
          test "$RUNNER_GATE" = success
          test "$INSTALL_GATE" = success
          test "$SOURCE_GATE" = success
          test "$TYPE_GATE" = success
          test "$UNIT_GATE" = success
          test "$BUILD_GATE" = success
          test "$POSTGRES_GATE" = success
          test "$CHROMIUM_GATE" = success
          test "$E2E_GATE" = success
          test "$IMAGE_GATE" = success
          test "$CANARY_GATE" = success
          test "$DEPLOY_GATE" = success
