name: Prosmet Primary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-primary-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and deploy on prosmet-primary
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
      DEPLOY_PORT: "3100"
    steps:
      - name: Verify runner identity
        id: runner
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }} / ${{ runner.arch }}"
          test "${{ runner.name }}" = "prosmet-primary"

      - name: Checkout
        id: checkout
        if: steps.runner.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Node 22
        id: node
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Create lockfile when repository is freshly initialized
        id: lockfile
        if: steps.node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies
        id: install
        if: steps.lockfile.outcome == 'success'
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Source contract
        id: source_contract
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run source:contract

      - name: TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        id: unit_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Install Chromium
        id: chromium
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile E2E
        id: e2e
        if: steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        run: npm run e2e

      - name: Build immutable production image
        id: image
        if: steps.source_contract.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.build.outcome == 'success' && steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "prosmet:${GITHUB_SHA}" .
          docker tag "prosmet:${GITHUB_SHA}" prosmet:latest

      - name: Deploy canary container
        id: canary
        if: steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/prosmet
          if [ ! -f /opt/prosmet/.env ]; then
            cat > /opt/prosmet/.env <<'ENV'
          NODE_ENV=production
          PROSMET_DEFAULT_PROVIDER=rules
          NEXT_PUBLIC_AGUI_AGENT_URL=/api/agent
          ENV
            chmod 600 /opt/prosmet/.env
          fi

          docker rm -f prosmet-canary >/dev/null 2>&1 || true
          docker run -d \
            --name prosmet-canary \
            --restart unless-stopped \
            --env-file /opt/prosmet/.env \
            -p 127.0.0.1:13100:3100 \
            --health-cmd='node -e "fetch(\"http://127.0.0.1:3100/api/health\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"' \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=12 \
            "prosmet:${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13100/api/health >/tmp/prosmet-canary-health.json; then
              cat /tmp/prosmet-canary-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs prosmet-canary
          exit 1

      - name: Promote canary to Primary
        id: deploy
        if: steps.canary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f prosmet >/dev/null 2>&1 || true
          docker run -d \
            --name prosmet \
            --restart unless-stopped \
            --env-file /opt/prosmet/.env \
            -p "${DEPLOY_PORT}:3100" \
            --health-cmd='node -e "fetch(\"http://127.0.0.1:3100/api/health\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"' \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=12 \
            "prosmet:${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${DEPLOY_PORT}/api/health" >/tmp/prosmet-health.json; then
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${DEPLOY_PORT}/api/health"
          docker rm -f prosmet-canary >/dev/null 2>&1 || true

      - name: Write release evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/release.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "runner": "${{ runner.name }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "http://78.17.4.108:${DEPLOY_PORT}/",
            "health": "http://78.17.4.108:${DEPLOY_PORT}/api/health",
            "image": "prosmet:${GITHUB_SHA}",
            "gate": "${{ steps.deploy.outcome }}"
          }
          JSON

      - name: Upload browser and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-primary-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish observable Primary status
        if: always()
        uses: actions/github-script@v7
        env:
          RUNNER_GATE: ${{ steps.runner.outcome }}
          CHECKOUT_GATE: ${{ steps.checkout.outcome }}
          LOCKFILE_GATE: ${{ steps.lockfile.outcome }}
          INSTALL_GATE: ${{ steps.install.outcome }}
          SOURCE_GATE: ${{ steps.source_contract.outcome }}
          TYPE_GATE: ${{ steps.typecheck.outcome }}
          UNIT_GATE: ${{ steps.unit_tests.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
          E2E_GATE: ${{ steps.e2e.outcome }}
          IMAGE_GATE: ${{ steps.image.outcome }}
          CANARY_GATE: ${{ steps.canary.outcome }}
          DEPLOY_GATE: ${{ steps.deploy.outcome }}
        with:
          script: |
            const title = "[Prosmet Primary] Deployment status";
            const checks = [
              ["runner prosmet-primary", process.env.RUNNER_GATE],
              ["checkout", process.env.CHECKOUT_GATE],
              ["lockfile", process.env.LOCKFILE_GATE],
              ["npm ci", process.env.INSTALL_GATE],
              ["source contract", process.env.SOURCE_GATE],
              ["typecheck", process.env.TYPE_GATE],
              ["unit tests", process.env.UNIT_GATE],
              ["production build", process.env.BUILD_GATE],
              ["Chromium", process.env.CHROMIUM_GATE],
              ["desktop/mobile E2E", process.env.E2E_GATE],
              ["Docker image", process.env.IMAGE_GATE],
              ["canary", process.env.CANARY_GATE],
              ["Primary deploy", process.env.DEPLOY_GATE],
            ];
            const icon = (value) => value === "success" ? "✅" : value === "skipped" ? "⏭️" : "❌";
            const body = [
              `**Commit:** \`${context.sha}\``,
              `**Runner:** \`${context.runner.name}\``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Updated:** ${new Date().toISOString()}`,
              "",
              "| Gate | Result |",
              "|---|---|",
              ...checks.map(([name, value]) => `| ${name} | ${icon(value)} ${value || "not-run"} |`),
              "",
              process.env.DEPLOY_GATE === "success"
                ? "**LIVE:** http://78.17.4.108:3100/"
                : "Deployment is blocked until every required gate passes.",
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Show logs on failure
        if: always() && steps.deploy.outcome != 'success'
        shell: bash
        run: |
          docker logs prosmet-canary 2>/dev/null || true
          docker logs prosmet 2>/dev/null || true

      - name: Enforce green release gate
        if: always()
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.runner.outcome }}
          INSTALL_GATE: ${{ steps.install.outcome }}
          SOURCE_GATE: ${{ steps.source_contract.outcome }}
          TYPE_GATE: ${{ steps.typecheck.outcome }}
          UNIT_GATE: ${{ steps.unit_tests.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
          E2E_GATE: ${{ steps.e2e.outcome }}
          IMAGE_GATE: ${{ steps.image.outcome }}
          CANARY_GATE: ${{ steps.canary.outcome }}
          DEPLOY_GATE: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          test "$RUNNER_GATE" = success
          test "$INSTALL_GATE" = success
          test "$SOURCE_GATE" = success
          test "$TYPE_GATE" = success
          test "$UNIT_GATE" = success
          test "$BUILD_GATE" = success
          test "$CHROMIUM_GATE" = success
          test "$E2E_GATE" = success
          test "$IMAGE_GATE" = success
          test "$CANARY_GATE" = success
          test "$DEPLOY_GATE" = success
