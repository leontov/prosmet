name: Prosmet Primary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-primary-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and deploy on prosmet-primary
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
      PROSMET_DATABASE_DRIVER: "pglite"
      PROSMET_PGLITE_DIR: ${{ runner.temp }}/prosmet-e2e-${{ github.run_id }}-pg
      DEPLOY_PORT: "3200"
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      MIMO_BASE_URL: ${{ vars.MIMO_BASE_URL }}
      MIMO_MODEL: ${{ vars.MIMO_MODEL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
    steps:
      - name: Verify runner identity
        id: runner
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }} / ${{ runner.arch }}"
          test "${{ runner.name }}" = "prosmet-primary"

      - name: Checkout
        id: checkout
        if: steps.runner.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Node 22
        id: node
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Prepare evidence and embedded PostgreSQL
        id: database
        if: steps.node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PROSMET_PGLITE_DIR"
          mkdir -p artifacts/logs artifacts/screenshots "$PROSMET_PGLITE_DIR"
          echo "PGlite data: $PROSMET_PGLITE_DIR"

      - name: Create lockfile when repository is freshly initialized
        id: lockfile
        if: steps.database.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies
        id: install
        if: steps.lockfile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee artifacts/logs/npm-ci.log

      - name: Source contract
        id: source_contract
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run source:contract 2>&1 | tee artifacts/logs/source-contract.log

      - name: TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log

      - name: Unit tests
        id: unit_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee artifacts/logs/unit-tests.log

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/logs/build.log

      - name: Install Playwright Chromium
        id: chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee artifacts/logs/chromium.log

      - name: Desktop and mobile Chromium E2E
        id: e2e
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee artifacts/logs/e2e.log

      - name: Verify standalone production bundle
        id: bundle
        if: steps.source_contract.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.build.outcome == 'success' && steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .next/standalone/server.js
          test -d .next/static
          test -f public/sql-wasm.wasm
          node -e 'const p=require("./.next/standalone/package.json"); console.log("standalone", p.name || "prosmet")'

      - name: Start and probe standalone canary
        id: canary
        if: steps.bundle.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          CANARY_HOME="$RUNNER_TEMP/prosmet-canary-${GITHUB_RUN_ID}"
          rm -rf "$CANARY_HOME"
          mkdir -p "$CANARY_HOME"
          HOME="$CANARY_HOME" bash deployment/direct-primary.sh "$GITHUB_SHA" 13100
          cp "$CANARY_HOME/.prosmet/primary-health.json" artifacts/canary-health.json
          cp "$CANARY_HOME/.prosmet/primary-backend.json" artifacts/canary-backend.json
          cp "$CANARY_HOME/.prosmet/primary-agent.sse" artifacts/canary-agent.sse
          CANARY_PID="$(cat "$CANARY_HOME/.prosmet/prosmet.pid")"
          kill "$CANARY_PID" 2>/dev/null || true

      - name: Promote app, AG-UI backend and embedded PostgreSQL to Primary
        id: deploy
        if: steps.canary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deployment/direct-primary.sh "$GITHUB_SHA" "$DEPLOY_PORT"
          cp "$HOME/.prosmet/primary-health.json" artifacts/primary-health.json
          cp "$HOME/.prosmet/primary-backend.json" artifacts/primary-backend.json
          cp "$HOME/.prosmet/primary-agent.sse" artifacts/primary-agent.sse

      - name: Write release evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/release.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "runner": "${{ runner.name }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "http://78.17.4.108:${DEPLOY_PORT}/",
            "health": "http://78.17.4.108:${DEPLOY_PORT}/api/health",
            "backendStatus": "http://78.17.4.108:${DEPLOY_PORT}/api/backend/status",
            "agent": "http://78.17.4.108:${DEPLOY_PORT}/api/agent",
            "sync": "http://78.17.4.108:${DEPLOY_PORT}/api/sync",
            "databaseDriver": "pglite",
            "gate": "${{ steps.deploy.outcome }}"
          }
          JSON

      - name: Clean verification database
        if: always()
        run: rm -rf "$PROSMET_PGLITE_DIR"

      - name: Upload browser, logs and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-primary-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish observable Primary status
        if: always()
        uses: actions/github-script@v7
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_GATE: ${{ steps.runner.outcome }}
          CHECKOUT_GATE: ${{ steps.checkout.outcome }}
          DATABASE_GATE: ${{ steps.database.outcome }}
          INSTALL_GATE: ${{ steps.install.outcome }}
          SOURCE_GATE: ${{ steps.source_contract.outcome }}
          TYPE_GATE: ${{ steps.typecheck.outcome }}
          UNIT_GATE: ${{ steps.unit_tests.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
          E2E_GATE: ${{ steps.e2e.outcome }}
          BUNDLE_GATE: ${{ steps.bundle.outcome }}
          CANARY_GATE: ${{ steps.canary.outcome }}
          DEPLOY_GATE: ${{ steps.deploy.outcome }}
        with:
          script: |
            const title = "[Prosmet Primary] Deployment status";
            const checks = [
              ["runner prosmet-primary", process.env.RUNNER_GATE],
              ["checkout", process.env.CHECKOUT_GATE],
              ["embedded PostgreSQL", process.env.DATABASE_GATE],
              ["npm ci", process.env.INSTALL_GATE],
              ["source contract", process.env.SOURCE_GATE],
              ["typecheck", process.env.TYPE_GATE],
              ["unit tests", process.env.UNIT_GATE],
              ["production build", process.env.BUILD_GATE],
              ["Chromium", process.env.CHROMIUM_GATE],
              ["desktop/mobile Chromium E2E", process.env.E2E_GATE],
              ["standalone bundle", process.env.BUNDLE_GATE],
              ["canary app/backend/database", process.env.CANARY_GATE],
              ["Primary app/backend/database", process.env.DEPLOY_GATE]
            ];
            const icon = (value) => value === "success" ? "✅" : value === "skipped" ? "⏭️" : "❌";
            const body = [
              `**Commit:** \`${context.sha}\``,
              `**Runner:** \`${process.env.RUNNER_NAME}\``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Updated:** ${new Date().toISOString()}`,
              "",
              "| Gate | Result |",
              "|---|---|",
              ...checks.map(([name, value]) => `| ${name} | ${icon(value)} ${value || "not-run"} |`),
              "",
              process.env.DEPLOY_GATE === "success"
                ? "**LIVE:** http://78.17.4.108:3200/\n\n**BACKEND:** http://78.17.4.108:3200/api/backend/status"
                : "Deployment is blocked until every required gate passes."
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Show direct deployment log on failure
        if: always() && steps.deploy.outcome != 'success'
        run: tail -n 250 "$HOME/.prosmet/prosmet.log" 2>/dev/null || true

      - name: Enforce green release gate
        if: always()
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.runner.outcome }}
          DATABASE_GATE: ${{ steps.database.outcome }}
          INSTALL_GATE: ${{ steps.install.outcome }}
          SOURCE_GATE: ${{ steps.source_contract.outcome }}
          TYPE_GATE: ${{ steps.typecheck.outcome }}
          UNIT_GATE: ${{ steps.unit_tests.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
          E2E_GATE: ${{ steps.e2e.outcome }}
          BUNDLE_GATE: ${{ steps.bundle.outcome }}
          CANARY_GATE: ${{ steps.canary.outcome }}
          DEPLOY_GATE: ${{ steps.deploy.outcome }}
        run: |
          set -Eeuo pipefail
          test "$RUNNER_GATE" = success
          test "$DATABASE_GATE" = success
          test "$INSTALL_GATE" = success
          test "$SOURCE_GATE" = success
          test "$TYPE_GATE" = success
          test "$UNIT_GATE" = success
          test "$BUILD_GATE" = success
          test "$CHROMIUM_GATE" = success
          test "$E2E_GATE" = success
          test "$BUNDLE_GATE" = success
          test "$CANARY_GATE" = success
          test "$DEPLOY_GATE" = success
