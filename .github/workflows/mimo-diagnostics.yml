name: Prosmet MiMo Diagnostics

on:
  push:
    branches: [fix/mimo-integration-v1]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: prosmet-mimo-diagnostics
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Verify trusted Primary runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - name: Inspect the live non-secret agent registry
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            http://127.0.0.1:3200/api/agents > live-agents.json

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const registry = JSON.parse(await readFile('live-agents.json', 'utf8'));
          const agents = Array.isArray(registry.agents) ? registry.agents : [];
          const mimo = agents.filter((agent) => {
            const value = `${agent.name || ''} ${agent.model || ''} ${agent.baseUrl || ''}`.toLowerCase();
            return value.includes('mimo') || value.includes('xiaomimimo');
          });
          const analysis = mimo.map((agent) => {
            let recommendedBaseUrl = null;
            let issue = null;
            try {
              const url = new URL(agent.baseUrl || '');
              const host = url.hostname.toLowerCase();
              const path = url.pathname.replace(/\/+$/, '');
              if (host === 'api.xiaomimimo.com') {
                recommendedBaseUrl = 'https://api.xiaomimimo.com/v1';
              } else if (/^token-plan-(cn|sgp|ams)\.xiaomimimo\.com$/.test(host)) {
                recommendedBaseUrl = `${url.origin}/v1`;
              }
              if (recommendedBaseUrl && `${url.origin}${path}` !== recommendedBaseUrl && !path.endsWith('/v1/chat/completions')) {
                issue = 'base-url-missing-v1-or-uses-non-api-path';
              }
              if (/^mimo-v2(?:-|$)/.test(String(agent.model || '').toLowerCase())) {
                issue = issue ? `${issue};legacy-v2-model` : 'legacy-v2-model';
              }
            } catch {
              issue = 'invalid-base-url';
            }
            return {
              id: agent.id,
              name: agent.name,
              type: agent.type,
              active: agent.active,
              model: agent.model,
              baseUrl: agent.baseUrl,
              hasSecret: agent.hasSecret,
              issue,
              recommendedBaseUrl,
              recommendedModel: 'mimo-v2.5-pro'
            };
          });
          await writeFile('mimo-diagnostics.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            activeAgentId: registry.activeAgentId || null,
            mimoAgents: analysis
          }, null, 2) + '\n');
          console.log(JSON.stringify({ mimoAgents: analysis }, null, 2));
          NODE

      - name: Exercise the configured MiMo connection through the production adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN_FILE="$HOME/.prosmet-greenfield/config/admin.token"
          test -s "$TOKEN_FILE"
          AGENT_ID="$(node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const data = JSON.parse(await readFile('mimo-diagnostics.json', 'utf8'));
          const active = data.mimoAgents.find((agent) => agent.active) || data.mimoAgents[0];
          if (active?.id) process.stdout.write(active.id);
          NODE
          )"

          if [ -z "$AGENT_ID" ]; then
            printf '{"status":"SKIPPED","reason":"no-mimo-agent"}\n' > mimo-test-response.json
            exit 0
          fi

          STATUS="$(curl --silent --show-error \
            --output mimo-test-response.json \
            --dump-header mimo-test-headers.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-prosmet-admin-token: $(tr -d '\r\n' < "$TOKEN_FILE")" \
            "http://127.0.0.1:3200/api/agents/${AGENT_ID}/test" || true)"
          printf '%s\n' "$STATUS" > mimo-test-status.txt
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const status = (await readFile('mimo-test-status.txt', 'utf8')).trim();
          let response = null;
          try { response = JSON.parse(await readFile('mimo-test-response.json', 'utf8')); } catch {}
          await writeFile('mimo-test-summary.json', JSON.stringify({
            httpStatus: Number(status || 0),
            response
          }, null, 2) + '\n');
          NODE

      - name: Upload sanitized MiMo diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-mimo-diagnostics-${{ github.run_id }}
          path: |
            mimo-diagnostics.json
            mimo-test-summary.json
            mimo-test-response.json
            mimo-test-headers.txt
          if-no-files-found: error
          retention-days: 3
