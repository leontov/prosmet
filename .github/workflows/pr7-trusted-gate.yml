name: PR7 Trusted PostgreSQL Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr7-trusted-gate.yml
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: prosmet-pr7-trusted
  cancel-in-progress: true

jobs:
  verify-pr7:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.number == 7
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
      PROSMET_E2E_PORT: "13120"
    steps:
      - name: Verify prosmet-primary runner
        run: |
          set -Eeuo pipefail
          echo "Runner: ${{ runner.name }}"
          echo "Machine: $(hostname)"
          id
          test "${{ runner.name }}" = "prosmet-primary"

      - name: Publish trusted gate start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 7,
              body: [
                "Trusted Primary gate: RUNNING",
                `Runner: \`${{ runner.name }}\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "Testing persistent PostgreSQL, DATABASE_URL, contracts, types, tests, build, desktop/mobile Chromium, IndexedDB reload, outbox→PostgreSQL→pull and removal of browser WASM."
              ].join("\n\n")
            });

      - name: Checkout PR 7 branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/server-postgres-indexeddb
          fetch-depth: 0
          clean: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Prepare evidence
        run: mkdir -p artifacts/logs artifacts/database artifacts/screenshots

      - name: Install exact dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee artifacts/logs/npm-ci.log

      - name: Start persistent PostgreSQL on Primary
        run: |
          set -o pipefail
          bash deployment/provision-postgres.sh 2>&1 | tee artifacts/logs/postgres-provision.log
          source "$HOME/.prosmet/database.env"
          echo "::add-mask::$DATABASE_URL"
          echo "PROSMET_DATABASE_DRIVER=postgres" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify real DATABASE_URL
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' | tee artifacts/database/postgres-connection.json
          import pg from "pg";
          const connectionString = process.env.DATABASE_URL;
          if (!connectionString?.startsWith("postgresql://")) {
            throw new Error("DATABASE_URL is missing or is not PostgreSQL");
          }
          const parsed = new URL(connectionString);
          const client = new pg.Client({ connectionString, connectionTimeoutMillis: 10_000 });
          await client.connect();
          try {
            const result = await client.query(
              "SELECT current_database() AS database, current_user AS user, inet_server_addr()::text AS host, inet_server_port() AS port, version() AS version"
            );
            const row = result.rows[0];
            if (row.database !== "prosmet") throw new Error(`Unexpected database ${row.database}`);
            if (row.user !== "prosmet") throw new Error(`Unexpected database user ${row.user}`);
            console.log(JSON.stringify({
              connected: true,
              protocol: parsed.protocol,
              hostname: parsed.hostname,
              port: Number(parsed.port),
              database: row.database,
              user: row.user,
              serverHost: row.host,
              serverPort: row.port,
              version: row.version
            }, null, 2));
          } finally {
            await client.end();
          }
          NODE

      - name: Source contract
        run: |
          set -o pipefail
          npm run source:contract 2>&1 | tee artifacts/logs/source-contract.log

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log

      - name: Unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee artifacts/logs/unit-tests.log

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/logs/build.log

      - name: Install Chromium
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee artifacts/logs/chromium-install.log

      - name: Desktop and mobile Chromium including IndexedDB and sync
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee artifacts/logs/e2e.log

      - name: Assert repository contains no browser WASM runtime
        run: |
          set -Eeuo pipefail
          test ! -e public/sql-wasm.wasm
          test ! -e public/sql-wasm-browser.wasm
          test ! -e lib/local/database.ts
          test ! -e scripts/copy-sql-wasm.mjs
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          if (pkg.dependencies?.["sql.js"]) throw new Error("sql.js is still installed");
          if (pkg.dependencies?.["@electric-sql/pglite"]) throw new Error("PGlite is still installed");
          console.log("No browser SQL/WASM dependency remains");
          NODE

      - name: Collect persistent PostgreSQL evidence
        if: always()
        run: |
          cp "$HOME/.prosmet/postgres.log" artifacts/logs/postgres.log 2>/dev/null || true
          cp "$HOME/.prosmet/postgres-ready.json" artifacts/database/postgres-ready.json 2>/dev/null || true
          cp "$HOME/.prosmet/postgres-status.json" artifacts/database/postgres-status.json 2>/dev/null || true

      - name: Upload complete gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-pr7-gate-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30

      - name: Publish PR 7 gate result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            const body = [
              `Trusted Primary gate: ${success ? "PASS" : "FAIL"}`,
              `Commit tested: \`rebuild/server-postgres-indexeddb\``,
              `Runner: \`${{ runner.name }}\``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              success
                ? "PostgreSQL, DATABASE_URL, contracts, types, tests, build, desktop/mobile Chromium, IndexedDB reload, outbox→PostgreSQL→pull and no-WASM checks passed."
                : "One or more required release gates failed; PR 7 must not be merged."
            ].join("\n\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 7,
              body
            });
