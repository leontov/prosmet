name: Apply mobile estimate price editor

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-mobile-estimate-price.mjs
      - .github/workflows/apply-mobile-estimate-price.yml

permissions:
  contents: write

concurrency:
  group: prosmet-mobile-price-patch
  cancel-in-progress: true

jobs:
  apply:
    name: Materialize mobile price editing on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused source patch
        run: node scripts/apply-mobile-estimate-price.mjs

      - name: Commit visible source and remove carrier files
        run: |
          set -Eeuo pipefail
          rm -f scripts/apply-mobile-estimate-price.mjs
          rm -f .github/workflows/apply-mobile-estimate-price.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(editor): make mobile estimate price editing functional"
          git pull --rebase origin main
          git push origin HEAD:main
