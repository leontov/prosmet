name: Prosmet repository edge credential probe

on:
  push:
    branches: [ops/edge-secret-probe]
    paths:
      - ".github/workflows/edge-secret-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Detect configured routes without exposing values
        id: probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PRIMARY_SSH_PRIVATE_KEY: ${{ secrets.PRIMARY_SSH_PRIVATE_KEY }}
          KOLIBRI_SSH_PRIVATE_KEY: ${{ secrets.KOLIBRI_SSH_PRIVATE_KEY }}
          ROOT_SSH_PRIVATE_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}
          SSH_CERTIFICATE: ${{ secrets.SSH_CERTIFICATE }}
          PRIMARY_SSH_CERTIFICATE: ${{ secrets.PRIMARY_SSH_CERTIFICATE }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          PRIMARY_SUDO_PASSWORD: ${{ secrets.PRIMARY_SUDO_PASSWORD }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          names=(CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID CLOUDFLARE_ZONE_ID CF_ZONE_ID CLOUDFLARE_TUNNEL_TOKEN CLOUDFLARED_TOKEN TUNNEL_TOKEN SSH_PRIVATE_KEY PRIMARY_SSH_PRIVATE_KEY KOLIBRI_SSH_PRIVATE_KEY ROOT_SSH_PRIVATE_KEY SSH_CERTIFICATE PRIMARY_SSH_CERTIFICATE SUDO_PASSWORD PRIMARY_SUDO_PASSWORD EXPO_TOKEN)
          present=()
          for name in "${names[@]}"; do [[ -n "${!name:-}" ]] && present+=("$name"); done
          echo "count=${#present[@]}" >> "$GITHUB_OUTPUT"
          echo "names=$(IFS=,; echo "${present[*]:-none}")" >> "$GITHUB_OUTPUT"

      - name: Publish route presence
        if: always()
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.probe.outputs.count }}
          NAMES: ${{ steps.probe.outputs.names }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                "PROSMET REPOSITORY EDGE CREDENTIAL PROBE",
                `Configured route count: \`${process.env.COUNT || "0"}\``,
                `Configured names: \`${process.env.NAMES || "none"}\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "Only secret presence was evaluated."
              ].join("\n\n")
            });
