name: Prosmet Dev Fix Mobile Reload Locator

on:
  push:
    branches: [feature/construction-lifecycle-v1]

permissions:
  contents: write

concurrency:
  group: prosmet-dev-fix-mobile-reload-locator
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'chore(ci): apply scoped mobile reload locator fix' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/construction-lifecycle-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Scope the mobile reload assertion to visible application content
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/app.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = 'await expect(page.getByText(stored.title, { exact: true }).first()).toBeVisible();'
          new = 'await expect(page.locator(".pro-mobile-main").getByText(stored.title, { exact: true }).first()).toBeVisible();'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy locator, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/dev-fix-mobile-reload-locator.yml

      - name: Verify source, types, tests, build and browser flows
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npx playwright install chromium
          npm run e2e

      - name: Commit verified fix
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(e2e): scope mobile reload assertion to visible workspace"
          git push origin HEAD:feature/construction-lifecycle-v1
