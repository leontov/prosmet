name: Prosmet PR Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prosmet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 70
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
    steps:
      - name: Verify runner
        run: |
          echo "Runner: ${{ runner.name }}"
          test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Provision PostgreSQL
        run: |
          set -Eeuo pipefail
          bash deployment/provision-postgres.sh
          source "$HOME/.prosmet/database.env"
          echo "::add-mask::$DATABASE_URL"
          echo "PROSMET_DATABASE_DRIVER=postgres" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Prepare evidence
        run: mkdir -p artifacts/logs artifacts/screenshots

      - name: Lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - run: npm ci --no-audit --no-fund
      - run: npm run source:contract
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-pr-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
