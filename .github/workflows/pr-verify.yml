name: Prosmet PR Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prosmet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
      DATABASE_URL: postgresql://prosmet:prosmet-ci@127.0.0.1:55432/prosmet
    steps:
      - name: Verify runner
        run: |
          echo "Runner: ${{ runner.name }}"
          test "${{ runner.name }}" = "prosmet-primary"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Lockfile
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
      - run: npm ci --no-audit --no-fund
      - run: npm run source:contract
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Start isolated PostgreSQL
        run: |
          docker rm -f prosmet-ci-postgres >/dev/null 2>&1 || true
          docker run -d \
            --name prosmet-ci-postgres \
            -e POSTGRES_DB=prosmet \
            -e POSTGRES_USER=prosmet \
            -e POSTGRES_PASSWORD=prosmet-ci \
            -p 127.0.0.1:55432:5432 \
            --health-cmd='pg_isready -U prosmet -d prosmet' \
            --health-interval=3s \
            --health-timeout=3s \
            --health-retries=20 \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Health.Status}}' prosmet-ci-postgres)" = healthy && exit 0
            sleep 2
          done
          docker logs prosmet-ci-postgres
          exit 1
      - run: npx playwright install chromium
      - run: npm run e2e
      - if: always()
        run: docker rm -f prosmet-ci-postgres >/dev/null 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-pr-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
