name: Prosmet PR Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prosmet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
    steps:
      - name: Verify runner
        run: |
          echo "Runner: ${{ runner.name }}"
          id
          test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Prepare evidence
        run: mkdir -p artifacts/logs artifacts/screenshots

      - name: Lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install application and PostgreSQL binaries
        run: npm ci --no-audit --no-fund 2>&1 | tee artifacts/logs/npm-ci.log

      - name: Provision persistent PostgreSQL without sudo
        run: |
          set -o pipefail
          bash deployment/provision-postgres.sh 2>&1 | tee artifacts/logs/postgres-provision.log
          source "$HOME/.prosmet/database.env"
          echo "::add-mask::$DATABASE_URL"
          echo "PROSMET_DATABASE_DRIVER=postgres" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - run: npm run source:contract
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run e2e

      - name: Collect PostgreSQL evidence
        if: always()
        run: |
          cp "$HOME/.prosmet/postgres.log" artifacts/logs/postgres.log 2>/dev/null || true
          cp "$HOME/.prosmet/postgres-ready.json" artifacts/logs/postgres-ready.json 2>/dev/null || true
          cp "$HOME/.prosmet/postgres-status.json" artifacts/logs/postgres-status.json 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-pr-${{ github.run_id }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
