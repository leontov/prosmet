name: ProSmet Dev OpenAPI Contract V1

on:
  push:
    branches: [feature/openapi-contract-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prosmet-dev-openapi-contract-v1
  cancel-in-progress: true

jobs:
  apply_and_verify:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: apply and verify OpenAPI contract v1'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 70
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/openapi-contract-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply server and CI contract integration
        run: |
          set -Eeuo pipefail
          node scripts/apply-openapi-contract-v1.mjs
          node scripts/openapi-contract.mjs --write

      - name: Verify source, contracts, browser and performance gates
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata
          npx playwright install chromium
          npm run e2e
          npm run lighthouse:landing

      - name: Upload OpenAPI and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-openapi-contract-${{ github.run_id }}
          path: |
            apps/web/public/openapi.json
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
            apps/web/lighthouse
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified production tree
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-openapi-contract-v1.mjs .github/workflows/dev-openapi-contract-v1.yml
          git add \
            package.json \
            apps/web/server.mjs \
            apps/web/public/openapi.json \
            apps/web/e2e/openapi.spec.ts \
            scripts/openapi-source.mjs \
            scripts/openapi-contract.mjs \
            scripts/greenfield-contract.mjs \
            docs/architecture/desktop-web-api-contract.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(api): publish and enforce OpenAPI 3.1 contract"
          git push origin HEAD:feature/openapi-contract-v1
