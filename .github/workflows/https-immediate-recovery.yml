name: Prosmet Immediate HTTPS Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/https-immediate-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-immediate-https
  cancel-in-progress: false

jobs:
  recover:
    name: Publish the currently healthy Prosmet release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Verify Primary and checkout main
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
      - name: Resolve the healthy internal release
        id: release
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/release artifacts/https
          for attempt in $(seq 1 180); do
            if curl -fsS --max-time 5 http://127.0.0.1:3200/api/health > artifacts/release/internal-health.json; then
              RELEASE_SHA="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!x.ok||!x.releaseSha)process.exit(1);process.stdout.write(x.releaseSha)' artifacts/release/internal-health.json)"
              echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
              cat artifacts/release/internal-health.json
              exit 0
            fi
            sleep 2
          done
          echo "No healthy Prosmet release on port 3200" >&2
          exit 1
      - name: Start Caddy with the granted low-port capability
        env:
          PROSMET_RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          PROSMET_PUBLIC_DOMAIN: kolibriai.online
          PROSMET_PUBLIC_IP: 78.17.4.108
        run: |
          set -Eeuo pipefail
          /usr/sbin/getcap /usr/local/bin/prosmet-caddy | tee artifacts/https/capability.txt
          grep -q 'cap_net_bind_service' artifacts/https/capability.txt
          bash deployment/provision-https.sh kolibriai.online 3200 2>&1 | tee artifacts/https/provision.log
      - name: Verify real public HTTPS, redirect and HSTS
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 20 https://kolibriai.online/api/health | tee artifacts/release/public-health.json
          grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/public-health.json
          curl -fsSI --max-time 20 https://kolibriai.online/ | tee artifacts/release/public-headers.txt
          grep -qi '^strict-transport-security:.*max-age=31536000' artifacts/release/public-headers.txt
          curl -fsSI --max-time 20 http://kolibriai.online/ | tee artifacts/release/http-redirect.txt
          grep -Eqi '^HTTP/[^ ]+ (301|302|307|308)' artifacts/release/http-redirect.txt
          grep -Eqi '^location: https://kolibriai.online/' artifacts/release/http-redirect.txt
      - name: Publish recovery result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FINAL_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        with:
          script: |
            const success = process.env.FINAL_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `IMMEDIATE HTTPS RECOVERY ${success ? "PASS" : "FAILED"}`,
                `Release: \`${process.env.RELEASE_SHA || "unknown"}\``,
                `Runner: \`prosmet-primary\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                success ? "APP: https://kolibriai.online/" : "Inspect the recovery job."
              ].join("\n\n")
            });
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-immediate-https-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
