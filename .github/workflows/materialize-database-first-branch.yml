# One-time workflow used only to materialize the database-first feature branch.
name: Materialize Database-First Feature Branch Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prosmet-database-first-main-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/trigger-database-first-materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/database-first-estimates-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Make the production server self-contained
        run: |
          set -Eeuo pipefail
          node scripts/inline-estimate-store.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: inline estimate store into production server"
          git push origin HEAD:feature/database-first-estimates-v1
