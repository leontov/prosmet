# One-time workflow used only to materialize the database-first feature branch.
name: Materialize Database-First Feature Branch Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prosmet-database-first-main-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/trigger-database-first-materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/database-first-estimates-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Apply database-first refactor to feature branch
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/apply-database-first-refactor.mjs';
          let source = await readFile(path, 'utf8');
          source = source.replace(/\n  contract = replaceOnce\(\n    contract,\n    '  persistence: [\s\S]*?\n    "noop guard"\n  \);/, '');
          await writeFile(path, source, 'utf8');
          NODE
          node scripts/apply-database-first-refactor.mjs

          # GitHub Apps without the workflows permission cannot push workflow-file changes.
          # Keep those paths unchanged in this generated commit; they are updated separately
          # through the repository contents API after the product source commit lands.
          git restore --source=HEAD -- \
            .github/workflows/greenfield-deploy.yml \
            .github/workflows/public-root-recovery.yml \
            .github/workflows/apply-database-first-refactor.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make AI estimates database-first artifacts"
          git push origin HEAD:feature/database-first-estimates-v1
