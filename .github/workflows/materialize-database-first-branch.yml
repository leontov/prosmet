# One-time workflow: materialize the feature branch, then delete itself from main.
name: Materialize Database-First Feature Branch Once

on:
  push:
    branches: [main]
    paths: [.github/workflows/materialize-database-first-branch.yml]

permissions:
  contents: write

concurrency:
  group: prosmet-database-first-main-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/database-first-estimates-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Apply database-first refactor to feature branch
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/apply-database-first-refactor.mjs';
          let source = await readFile(path, 'utf8');
          source = source.replace(/\n  contract = replaceOnce\(\n    contract,\n    '  persistence: [\s\S]*?\n    "noop guard"\n  \);/, '');
          await writeFile(path, source, 'utf8');
          NODE
          node scripts/apply-database-first-refactor.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make AI estimates database-first artifacts"
          git push origin HEAD:feature/database-first-estimates-v1

      - name: Remove this one-time workflow from main
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout --force main
          git reset --hard origin/main
          rm -f .github/workflows/materialize-database-first-branch.yml
          git add -A
          git commit -m "ops: remove one-time database-first materializer"
          git push origin main
