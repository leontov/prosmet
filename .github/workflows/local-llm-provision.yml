name: Prosmet Local LLM Provisioning

on:
  pull_request:
    branches: [main]
    paths:
      - deployment/provision-local-llm.sh
      - scripts/provision-agent-pool.mjs
      - .github/workflows/local-llm-provision.yml
      - docs/architecture/local-llm-and-free-tier.md
  push:
    branches: [main]
    paths:
      - deployment/provision-local-llm.sh
      - scripts/provision-agent-pool.mjs
      - .github/workflows/local-llm-provision.yml
      - docs/architecture/local-llm-and-free-tier.md
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model identifier
        required: false
        default: qwen3.5:9b
      activation:
        description: "Activation policy: auto, always or never"
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: prosmet-local-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate local LLM provisioning contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Validate scripts and secret boundary
        run: |
          set -Eeuo pipefail
          bash -n deployment/provision-local-llm.sh
          node --check scripts/provision-agent-pool.mjs
          ! grep -REn --exclude='local-llm-provision.yml' --exclude='local-llm-and-free-tier.md' \
            '(sk-[A-Za-z0-9_.-]{20,}|AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z_-]{20,})' \
            deployment scripts

  provision:
    name: Install, connect and verify local LLM on Primary
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 75
    env:
      PROSMET_LOCAL_LLM_MODEL: ${{ github.event.inputs.model || vars.PROSMET_LOCAL_LLM_MODEL || 'qwen3.5:9b' }}
      PROSMET_LOCAL_LLM_ACTIVATE: ${{ github.event.inputs.activation || vars.PROSMET_LOCAL_LLM_ACTIVATE || 'auto' }}
      PROSMET_LOCAL_LLM_BASE_URL: http://127.0.0.1:11434
      PROSMET_BASE_URL: http://127.0.0.1:3200
      PROSMET_QWEN_API_KEY: ${{ secrets.PROSMET_QWEN_API_KEY }}
      PROSMET_GROQ_API_KEY: ${{ secrets.PROSMET_GROQ_API_KEY }}
      PROSMET_GEMINI_API_KEY: ${{ secrets.PROSMET_GEMINI_API_KEY }}
      PROSMET_OPENROUTER_API_KEY: ${{ secrets.PROSMET_OPENROUTER_API_KEY }}
    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          test "${{ runner.os }}" = "Linux"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install and smoke-test loopback-only Ollama
        run: |
          set -Eeuo pipefail
          chmod 0755 deployment/provision-local-llm.sh
          deployment/provision-local-llm.sh | tee local-llm-provision.log
          cp "$HOME/.prosmet-greenfield/local-llm.json" local-llm.json

      - name: Wait for the production control plane
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            if curl -fsS --max-time 4 "$PROSMET_BASE_URL/api/health" > production-health.json; then
              grep -q '"ok":true' production-health.json
              exit 0
            fi
            sleep 2
          done
          cat "$HOME/.prosmet-greenfield/production.log" 2>/dev/null || true
          exit 1

      - name: Register local model and optional official free-tier providers
        run: |
          set -Eeuo pipefail
          test -s "$HOME/.prosmet-greenfield/config/admin.token"
          node scripts/provision-agent-pool.mjs | tee agent-pool-provision.log
          cp "$HOME/.prosmet-greenfield/agent-pool-evidence.json" agent-pool-evidence.json

      - name: Verify active control-plane state without exposing credentials
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('agent-pool-evidence.json', 'utf8'));
          const local = evidence.configuredProviders.find((entry) => entry.id === 'local-ollama');
          if (!evidence.ok || !local?.test?.ok) throw new Error('Local Ollama was not connected through ProSmet');
          if (evidence.security?.arbitrarySharedKeysAccepted !== false) throw new Error('Secret policy is not fail-closed');
          if (evidence.security?.localEndpointExposure !== 'loopback-only') throw new Error('Local Ollama exposure is unsafe');
          console.log(JSON.stringify({
            localModel: local.agent.model,
            localLatencyMs: local.test.latencyMs,
            activeAfter: evidence.activeAfter,
            configuredProviders: evidence.configuredProviders.map((entry) => ({
              id: entry.id,
              ok: entry.test.ok,
              model: entry.agent.model
            }))
          }, null, 2));
          NODE

      - name: Upload local LLM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-local-llm-${{ github.run_id }}
          path: |
            local-llm.json
            local-llm-provision.log
            production-health.json
            agent-pool-evidence.json
            agent-pool-provision.log
          if-no-files-found: warn
          retention-days: 30
