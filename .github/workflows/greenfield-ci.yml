name: ProSmet Primary Runner Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'ops/diagnose-primary-runner-availability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query repository self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
            > runners.json
          jq '{total_count, runners: [.runners[] | {id, name, os, status, busy, labels: [.labels[].name]}]}' runners.json | tee runner-report.json

      - name: Publish diagnostic to issue 77
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          PRIMARY="$(jq -c '.runners[]? | select(.name == "prosmet-primary") | {name, os, status, busy, labels: [.labels[].name]}' runners.json || true)"
          if [ -z "$PRIMARY" ]; then PRIMARY='{"name":"prosmet-primary","status":"not_registered"}'; fi
          printf 'Primary runner diagnostic from run `%s`:\n\n```json\n%s\n```\n\nQueued canonical PR jobs should not be treated as passed until this runner is online and non-busy.\n' \
            "$GITHUB_RUN_ID" "$PRIMARY" > comment.md
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - uses: actions/upload-artifact@v4
        with:
          name: prosmet-primary-runner-diagnostic-${{ github.run_id }}
          path: |
            runners.json
            runner-report.json
          retention-days: 7
