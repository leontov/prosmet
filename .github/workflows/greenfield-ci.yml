name: Prosmet Greenfield Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [greenfield/prosmet-v3]

permissions:
  contents: write

concurrency:
  group: prosmet-greenfield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_desktop_ipc_foundation:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/desktop-ipc-foundation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "1"
      PROSMET_GIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-ipc-foundation-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all

      - name: Install Tauri Linux build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install clean JavaScript workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Desktop IPC source and capability contract
        run: npm run desktop:security

      - name: Shared product source, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Rust format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust desktop unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the unsigned Linux desktop artifact
        run: npm run desktop:build

      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-desktop-ipc-foundation-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle
            apps/desktop/src-tauri/target/release/prosmet-desktop
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified canonical tree
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/greenfield-ci.yml > .github/workflows/greenfield-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/greenfield-ci.yml \
            package.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/capabilities/default.json \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/main.rs \
            scripts/desktop-ipc-contract.mjs \
            docs/architecture/desktop-ipc-foundation-v1.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(desktop): establish typed least-privilege IPC foundation"
          git push origin HEAD:feature/desktop-ipc-foundation-v1

  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'feature/desktop-ipc-foundation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, assistant-ui, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Desktop, mobile, landing and lifecycle browser acceptance
        run: npm run e2e

      - name: Landing Lighthouse and bundle budgets
        run: npm run lighthouse:landing

      - name: Upload browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
            apps/web/lighthouse
          if-no-files-found: warn
          retention-days: 14
