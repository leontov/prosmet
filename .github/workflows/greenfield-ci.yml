name: Prosmet Greenfield Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [greenfield/prosmet-v3]

permissions:
  contents: write

concurrency:
  group: prosmet-mobile-polish-registration-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply_mobile_polish_registration_export:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/mobile-polish-registration-export-v1'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 70
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-polish-registration-export-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply production-safe mobile, export and registration patch
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-mobile-polish-registration-export-v2.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          start = next((i for i, line in enumerate(lines) if "ns = re.sub" in line and "UserRegistrationPanel" in line), None)
          if start is None:
              raise SystemExit("Registration insertion patch marker missing")
          end = next((i for i in range(start, min(len(lines), start + 8)) if lines[i].strip() == "s = ns"), None)
          if end is None:
              raise SystemExit("Registration insertion patch end marker missing")
          replacement = [
              '    marker = "\\n    </section>\\n  );\\n}\\n\\nfunction AccountField"',
              '    if s.count(marker) != 1:',
              '        raise SystemExit("AccountView insertion marker not found")',
              '    s = s.replace(marker, "\\n      <UserRegistrationPanel />\\n    </section>\\n  );\\n}\\n\\nfunction AccountField", 1)',
          ]
          path.write_text("\n".join(lines[:start] + replacement + lines[end + 1:]) + "\n", encoding="utf-8")
          PY
          python3 scripts/apply-mobile-polish-registration-export-v2.py
          rm -f scripts/apply-mobile-polish-registration-export.py scripts/apply-mobile-polish-registration-export-v2.py README-polish-trigger*.txt

      - name: Verify complete product, exports, registration and mobile UI
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata
          npx playwright install chromium
          npm run e2e
          npm run lighthouse:landing

      - name: Commit verified source patch only
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/server.mjs \
            apps/web/src/app/AppEntry.tsx \
            apps/web/src/features/account/AccountView.tsx \
            apps/web/src/features/account/UserRegistrationPanel.tsx \
            apps/web/src/features/estimate/EstimateEditor.tsx \
            apps/web/src/features/estimate/branded-export.ts \
            apps/web/src/features/estimate/branded-export.test.ts \
            apps/web/src/mobile-brand-polish.css \
            apps/web/e2e/registration-export.spec.ts \
            scripts/greenfield-contract.mjs
          git add -A scripts/apply-mobile-polish-registration-export.py scripts/apply-mobile-polish-registration-export-v2.py README-polish-trigger*.txt
          git diff --cached --quiet && exit 0
          git commit -m "feat: polish mobile UI, branded exports and user registration"
          git push origin HEAD:feature/mobile-polish-registration-export-v1

  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'feature/mobile-polish-registration-export-v1'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, assistant-ui, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Desktop, mobile, landing and lifecycle browser acceptance
        run: npm run e2e

      - name: Landing Lighthouse and bundle budgets
        run: npm run lighthouse:landing

      - name: Upload browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
            apps/web/lighthouse
          if-no-files-found: warn
          retention-days: 14
