name: Prosmet Greenfield Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [greenfield/prosmet-v3]

permissions:
  contents: write

concurrency:
  group: prosmet-greenfield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply_web_appearance_polish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/web-desktop-canvas-polish-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/web-desktop-canvas-polish-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply desktop chrome and inline command canvas
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-web-desktop-chrome-v1.py
          rm -f scripts/apply-web-desktop-chrome-v1.py

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, TypeScript, unit and production build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser appearance acceptance
        run: npm run e2e

      - name: Landing Lighthouse and bundle budgets
        run: npm run lighthouse:landing

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prosmet-web-appearance-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-web-appearance-*.png
            apps/web/lighthouse
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified source and restore canonical workflow
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/greenfield-ci.yml > .github/workflows/greenfield-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/greenfield-ci.yml \
            apps/web/src/app/AppEntry.tsx \
            apps/web/src/app/ProfessionalApp.tsx \
            apps/web/src/features/workspace/WorkspaceCanvasFrame.tsx \
            apps/web/src/desktop-product-polish.css \
            apps/web/src/mobile-product-polish.css \
            apps/web/e2e/appearance.spec.ts
          git add -u scripts/apply-web-desktop-chrome-v1.py
          git diff --cached --quiet && exit 0
          git commit -m "style(web): deliver GPT-like desktop and iOS-like mobile workspace"
          git push origin HEAD:feature/web-desktop-canvas-polish-v1

  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'feature/web-desktop-canvas-polish-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, assistant-ui, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Desktop, mobile, landing and lifecycle browser acceptance
        run: npm run e2e

      - name: Landing Lighthouse and bundle budgets
        run: npm run lighthouse:landing

      - name: Upload browser and performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prosmet-greenfield-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
            apps/web/lighthouse
          if-no-files-found: warn
          retention-days: 14
