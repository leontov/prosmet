name: Prosmet Greenfield Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [greenfield/prosmet-v3]

permissions:
  contents: write

concurrency:
  group: prosmet-greenfield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean_mobile_user_session:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/mobile-user-session-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-user-session-v2
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove generated evidence from the source tree
        run: |
          set -Eeuo pipefail
          git rm -f --ignore-unmatch Cargo.lock
          git rm -f --ignore-unmatch apps/web/artifacts-*.png
          git rm -f --ignore-unmatch apps/web/lighthouse/landing.report.html
          git rm -f --ignore-unmatch apps/web/lighthouse/landing.report.json
          git rm -f --ignore-unmatch apps/web/lighthouse/landing.summary.json

      - name: Verify source contracts and build after cleanup
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata

      - name: Commit clean canonical branch
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/greenfield-ci.yml > .github/workflows/greenfield-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/greenfield-ci.yml
          git add -u Cargo.lock apps/web
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove generated QA evidence from mobile session PR"
          git push origin HEAD:feature/mobile-user-session-v2

  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'feature/mobile-user-session-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, assistant-ui, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Desktop, mobile, landing and lifecycle browser acceptance
        run: npm run e2e

      - name: Landing Lighthouse and bundle budgets
        run: npm run lighthouse:landing

      - name: Upload browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
            apps/web/lighthouse
          if-no-files-found: warn
          retention-days: 14
