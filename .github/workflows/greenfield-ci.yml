name: Prosmet Greenfield Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [greenfield/prosmet-v3]

permissions:
  contents: write

concurrency:
  group: prosmet-greenfield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply_mobile_estimate_title_autosize:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/mobile-estimate-title-autosize' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-estimate-title-autosize
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply prepared production fix and restore canonical CI
        run: |
          set -Eeuo pipefail
          test -f scripts/apply-mobile-estimate-title-autosize.py
          python3 scripts/apply-mobile-estimate-title-autosize.py
          rm -f scripts/apply-mobile-estimate-title-autosize.py
          git show origin/main:.github/workflows/greenfield-ci.yml > .github/workflows/greenfield-ci.yml

      - name: Verify complete source and browser suite
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata
          npx playwright install chromium
          npm run e2e

      - name: Commit verified production fix and canonical CI
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/estimate/EstimateEditor.tsx apps/web/src/styles.css apps/web/src/mobile-overrides.css apps/web/e2e/app.spec.ts .github/workflows/greenfield-ci.yml
          git add -A scripts/apply-mobile-estimate-title-autosize.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(mobile): grow estimate item titles without clipping"
          git push origin HEAD:fix/mobile-estimate-title-autosize

  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/mobile-estimate-title-autosize' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, assistant-ui, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Desktop and mobile browser acceptance
        run: npm run e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
          if-no-files-found: warn
          retention-days: 14
