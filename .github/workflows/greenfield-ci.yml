name: Prosmet Greenfield Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [greenfield/prosmet-v3]

permissions:
  contents: write

concurrency:
  group: prosmet-greenfield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply_mobile_placeholder_contract:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/construction-lifecycle-v1' &&
      hashFiles('.github/workflows/dev-sync-mobile-placeholder.yml') != ''
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/construction-lifecycle-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply UI contract and restore canonical workflow
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/app.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = 'toHaveAttribute("placeholder", "Опишите объект и замеры...")'
          new = 'toHaveAttribute("placeholder", "Спросить ProSmet…")'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one old placeholder assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/dev-sync-mobile-placeholder.yml
          git show origin/main:.github/workflows/greenfield-ci.yml > .github/workflows/greenfield-ci.yml

      - name: Verify source, lifecycle and desktop/mobile browser flows
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npm run desktop:metadata
          npx playwright install chromium
          npm run e2e

      - name: Commit verified contract and canonical CI
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/app.spec.ts .github/workflows/greenfield-ci.yml
          git add -A .github/workflows/dev-sync-mobile-placeholder.yml
          git diff --cached --quiet && exit 0
          git commit -m "test(mobile): align composer placeholder contract"
          git push origin HEAD:feature/construction-lifecycle-v1

  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'feature/construction-lifecycle-v1' ||
      hashFiles('.github/workflows/dev-sync-mobile-placeholder.yml') == ''
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clean workspace
        run: npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund

      - name: Source, assistant-ui, TypeScript, unit and build verification
        run: npm run verify

      - name: Desktop manifest
        run: npm run desktop:metadata

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Desktop and mobile browser acceptance
        run: npm run e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-greenfield-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts-*.png
          if-no-files-found: warn
          retention-days: 14
