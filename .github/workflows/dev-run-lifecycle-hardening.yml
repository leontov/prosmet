name: Prosmet Dev Run Lifecycle Hardening

on:
  push:
    branches: [feature/construction-lifecycle-v1]

permissions:
  contents: write
  issues: write

concurrency:
  group: prosmet-dev-run-lifecycle-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(ci): run lifecycle hardening'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/construction-lifecycle-v1
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply prepared source transformation
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-lifecycle-hardening.py
          rm -f scripts/apply-lifecycle-hardening.py
          rm -f .github/workflows/dev-run-lifecycle-hardening.yml

      - name: Verify complete product and lifecycle suite
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npx playwright install chromium
          npm run e2e

      - name: Commit verified source only
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/server.mjs scripts/greenfield-contract.mjs
          git add -A scripts/apply-lifecycle-hardening.py .github/workflows/dev-run-lifecycle-hardening.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(server): harden lifecycle routing and provider setup"
          git push origin HEAD:feature/construction-lifecycle-v1

      - name: Report result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 53,
              body: `LIFECYCLE_HARDENING run=${context.runId} source=${context.sha} status=${process.env.JOB_STATUS}`
            });
