name: Scaffold Universal Platform

on:
  push:
    branches: [feature/universal-platform-v1]
    paths:
      - "scripts/scaffold-universal-core.py"
      - "scripts/scaffold-universal-clients.py"
      - ".github/workflows/scaffold-universal-platform.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prosmet-universal-scaffold
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[universal-scaffold]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/universal-platform-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Generate universal core and clients
        run: |
          set -Eeuo pipefail
          python3 scripts/scaffold-universal-core.py
          python3 scripts/scaffold-universal-clients.py
          chmod +x deployment/install-rust-engine.sh scripts/bootstrap-superadmin.mjs

      - name: Normalize Rust sources
        run: cargo fmt --all

      - name: Generate locked native dependency graphs
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --prefix apps/mobile
          npm install --package-lock-only --ignore-scripts --prefix apps/desktop

      - name: Commit generated platform
        run: |
          set -Eeuo pipefail
          git config user.name "prosmet-release-bot"
          git config user.email "prosmet-release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Universal platform is already generated."
            exit 0
          fi
          git commit -m "build(universal): materialize cross-platform product [universal-scaffold]"
          git push origin HEAD:feature/universal-platform-v1
