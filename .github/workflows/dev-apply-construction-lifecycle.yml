name: Prosmet Dev Apply Construction Lifecycle

on:
  push:
    branches: [feature/construction-lifecycle-v1]

permissions:
  contents: write
  issues: write

concurrency:
  group: prosmet-dev-apply-construction-lifecycle
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(lifecycle):') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
      BUNDLE_BASE: https://filebin.net/prosmet-lifecycle-20260804-6d2f8b
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/construction-lifecycle-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Download and verify source bundle
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "$BUNDLE_BASE/prosmet-construction-lifecycle-v1.tgz" \
            -o "$RUNNER_TEMP/prosmet-construction-lifecycle-v1.tgz"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "$BUNDLE_BASE/prosmet-construction-lifecycle-v1.tgz.sha256" \
            -o "$RUNNER_TEMP/prosmet-construction-lifecycle-v1.tgz.sha256"
          cd "$RUNNER_TEMP"
          sha256sum -c prosmet-construction-lifecycle-v1.tgz.sha256
          tar -xzf prosmet-construction-lifecycle-v1.tgz -C "$GITHUB_WORKSPACE"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/dev-apply-construction-lifecycle.yml"

      - name: Verify complete implementation
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npx playwright install chromium
          npm run e2e

      - name: Commit verified implementation
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(lifecycle): complete construction workflow and professional UX"
          git push origin HEAD:feature/construction-lifecycle-v1

      - name: Report apply result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 53,
              body: `LIFECYCLE_APPLY run=${context.runId} sha=${context.sha} status=${{ job.status }}`
            });
