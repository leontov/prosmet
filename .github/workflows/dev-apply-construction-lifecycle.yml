name: Prosmet Dev Apply Construction Lifecycle

on:
  push:
    branches: [feature/construction-lifecycle-v1]

permissions:
  contents: write
  issues: write

concurrency:
  group: prosmet-dev-apply-construction-lifecycle
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(lifecycle):') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      CI: "1"
      BUNDLE_SHA256: 9603be1aa100db8663a8aba2a3b85d3f998855312440dad988ae100ac0486ce1
      BUNDLE_BLOBS: >-
        da49d9470c38ab3fe6bdcca320000ab4b8853737
        65d148a1f9ba0607cf52c2d2722cae2a9aec7e7b
        4455024322623532ff31b2af8e7cc0436ee07e48
        323494b8a472f008bdbb1e3fbdc144184430c0d6
        bc810babada34b7a68a394d4f38c1e2c9ff593ea
    steps:
      - name: Verify trusted runner
        run: test "${{ runner.name }}" = "prosmet-primary"

      - uses: actions/checkout@v4
        with:
          ref: feature/construction-lifecycle-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Reconstruct and verify source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          export BUNDLE_PATH="$RUNNER_TEMP/prosmet-construction-lifecycle-v1.tar.xz"
          node --input-type=module <<'NODE'
          import { appendFile, rm } from "node:fs/promises";
          const path = process.env.BUNDLE_PATH;
          await rm(path, { force: true });
          for (const sha of process.env.BUNDLE_BLOBS.trim().split(/\s+/)) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`, {
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                accept: "application/vnd.github+json",
                "x-github-api-version": "2022-11-28"
              }
            });
            if (!response.ok) throw new Error(`blob ${sha}: HTTP ${response.status}`);
            const body = await response.json();
            await appendFile(path, Buffer.from(String(body.content || "").replace(/\s+/g, ""), "base64"));
          }
          NODE
          printf '%s  %s\n' "$BUNDLE_SHA256" "$BUNDLE_PATH" | sha256sum -c -
          tar -xJf "$BUNDLE_PATH" -C "$GITHUB_WORKSPACE"
          sed -i 's/asksEstimate/estimateRequested/g' apps/web/server.mjs
          rm -f "$GITHUB_WORKSPACE/.github/workflows/dev-apply-construction-lifecycle.yml"

      - name: Verify complete implementation
        run: |
          set -Eeuo pipefail
          npm ci --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund
          npm run verify
          npx playwright install chromium
          npm run e2e

      - name: Commit verified implementation
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(lifecycle): complete construction workflow and professional UX"
          git push origin HEAD:feature/construction-lifecycle-v1

      - name: Report apply result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 53,
              body: `LIFECYCLE_APPLY run=${context.runId} sha=${context.sha} status=${{ job.status }}`
            });
