name: Launch Prosmet on 3200

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/launch-3200.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-live-3200
  cancel-in-progress: true

jobs:
  launch:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
    steps:
      - name: Verify Primary runner
        run: |
          set -Eeuo pipefail
          echo "Runner: ${{ runner.name }}"
          test "${{ runner.name }}" = "prosmet-primary"

      - name: Publish launch started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `**Commit:** \`${context.sha}\``,
                `**Runner:** \`${{ runner.name }}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Updated:** ${new Date().toISOString()}`,
                "",
                "## Launching on port 3200",
                "",
                "Build, frontend, AG-UI backend and embedded PostgreSQL are starting on Primary."
              ].join("\n")
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install
        run: |
          set -Eeuo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Verify source, types and calculations
        run: |
          set -Eeuo pipefail
          npm run source:contract
          npm run typecheck
          npm run test

      - name: Build production standalone
        run: npm run build

      - name: Launch frontend, AG-UI backend and embedded PostgreSQL
        run: |
          set -Eeuo pipefail
          bash deployment/direct-primary.sh "$GITHUB_SHA" 3200

      - name: Verify live application
        run: |
          set -Eeuo pipefail
          curl -fsS http://127.0.0.1:3200/api/health
          curl -fsS http://127.0.0.1:3200/api/backend/status | tee /tmp/prosmet-backend-status.json
          grep -q '"connected":true' /tmp/prosmet-backend-status.json
          curl -fsS http://127.0.0.1:3200/ >/dev/null
          echo "LIVE http://78.17.4.108:3200/"

      - name: Publish launch result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `**Commit:** \`${context.sha}\``,
                `**Runner:** \`${{ runner.name }}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Updated:** ${new Date().toISOString()}`,
                "",
                success ? "## ✅ Prosmet is live" : "## ❌ Launch failed",
                "",
                success ? "**APP:** http://78.17.4.108:3200/" : "Inspect the workflow log before retrying.",
                success ? "**HEALTH:** http://78.17.4.108:3200/api/health" : "",
                success ? "**BACKEND:** http://78.17.4.108:3200/api/backend/status" : ""
              ].filter(Boolean).join("\n")
            });
