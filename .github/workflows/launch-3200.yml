name: Launch Prosmet on 3200

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/launch-3200.yml
      - next.config.ts
      - package.json
      - package-lock.json
      - app/**
      - components/**
      - lib/**
      - public/**
      - deployment/**
      - scripts/**
      - e2e/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-live-3200
  cancel-in-progress: true

jobs:
  launch:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
    steps:
      - name: Verify Primary runner
        run: |
          set -Eeuo pipefail
          echo "Runner: ${{ runner.name }}"
          test "${{ runner.name }}" = "prosmet-primary"

      - name: Publish launch started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `**Commit:** \`${context.sha}\``,
                `**Runner:** \`${{ runner.name }}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Updated:** ${new Date().toISOString()}`,
                "",
                "## Launching on port 3200",
                "",
                "Native IndexedDB cache, persistent PostgreSQL, frontend and AG-UI backend are starting on Primary."
              ].join("\n")
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install application and PostgreSQL binaries
        run: |
          set -Eeuo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Provision persistent PostgreSQL without sudo
        run: |
          set -Eeuo pipefail
          bash deployment/provision-postgres.sh
          source "$HOME/.prosmet/database.env"
          echo "::add-mask::$DATABASE_URL"
          echo "PROSMET_DATABASE_DRIVER=postgres" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify source, types and calculations
        run: |
          set -Eeuo pipefail
          npm run source:contract
          npm run typecheck
          npm run test

      - name: Build production standalone
        run: npm run build

      - name: Launch frontend, AG-UI backend and PostgreSQL
        run: |
          set -Eeuo pipefail
          bash deployment/direct-primary.sh "$GITHUB_SHA" 3200

      - name: Verify live no-WASM application
        run: |
          set -Eeuo pipefail
          BASE_URL=http://127.0.0.1:3200
          curl -fsS "$BASE_URL/api/health"
          curl -fsS "$BASE_URL/api/backend/status" | tee /tmp/prosmet-backend-status.json
          grep -q '"connected":true' /tmp/prosmet-backend-status.json
          grep -q '"driver":"postgres"' /tmp/prosmet-backend-status.json
          grep -q '"browserCache":"IndexedDB"' /tmp/prosmet-backend-status.json
          grep -q '"wasm":false' /tmp/prosmet-backend-status.json

          curl -fsSI "$BASE_URL/" | tee /tmp/prosmet-headers.txt
          grep -qi "content-security-policy:.*script-src.*'unsafe-inline'" /tmp/prosmet-headers.txt
          if grep -qi "content-security-policy:.*'unsafe-eval'" /tmp/prosmet-headers.txt; then
            echo "Production CSP unexpectedly allows unsafe-eval" >&2
            exit 1
          fi
          if grep -qi "content-security-policy:.*'wasm-unsafe-eval'" /tmp/prosmet-headers.txt; then
            echo "Production CSP unexpectedly allows wasm-unsafe-eval" >&2
            exit 1
          fi

          curl -fsS "$BASE_URL/" | tee /tmp/prosmet-index.html >/dev/null
          if grep -qi 'sql-wasm\|sqlite wasm' /tmp/prosmet-index.html; then
            echo "Rendered application still references browser SQLite WASM" >&2
            exit 1
          fi

          curl -fsS -D /tmp/prosmet-favicon-headers.txt "$BASE_URL/favicon.ico" -o /tmp/prosmet-favicon
          grep -qi 'content-type: image/svg+xml' /tmp/prosmet-favicon-headers.txt
          test -s /tmp/prosmet-favicon

          test -s "$HOME/.prosmet/primary-agent.sse"
          grep -q '"type":"ACTIVITY_SNAPSHOT"' "$HOME/.prosmet/primary-agent.sse"
          grep -q '"messageId"' "$HOME/.prosmet/primary-agent.sse"
          grep -q '"type":"RUN_FINISHED"' "$HOME/.prosmet/primary-agent.sse"
          test -s "$HOME/.prosmet/primary-sync.json"
          test -s "$HOME/.prosmet/postgres-status.json"

          echo "LIVE http://78.17.4.108:3200/"

      - name: Publish launch result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `**Commit:** \`${context.sha}\``,
                `**Runner:** \`${{ runner.name }}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Updated:** ${new Date().toISOString()}`,
                "",
                success ? "## ✅ Prosmet is live" : "## ❌ Launch failed",
                "",
                success ? "**APP:** http://78.17.4.108:3200/" : "Inspect the workflow log before retrying.",
                success ? "**HEALTH:** http://78.17.4.108:3200/api/health" : "",
                success ? "**BACKEND:** http://78.17.4.108:3200/api/backend/status" : "",
                success ? "**SERVER DB:** persistent PostgreSQL connected" : "",
                success ? "**LOCAL CACHE:** native IndexedDB, no SQLite WASM" : "",
                success ? "**AG-UI:** streaming schema verified" : "",
                success ? "**CSP:** no production eval or WASM permissions" : ""
              ].filter(Boolean).join("\n")
            });
