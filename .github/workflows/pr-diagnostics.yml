name: Prosmet PR Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prosmet-pr-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PROSMET_DEFAULT_PROVIDER: "rules"
    steps:
      - name: Verify runner
        run: test "${{ runner.name }}" = "prosmet-primary"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          npm ci --no-audit --no-fund
      - name: Capture all gates
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/logs
          npm run source:contract >artifacts/logs/source-contract.log 2>&1
          SOURCE=$?
          npm run typecheck >artifacts/logs/typecheck.log 2>&1
          TYPE=$?
          npm run test >artifacts/logs/unit-tests.log 2>&1
          UNIT=$?
          npm run build >artifacts/logs/build.log 2>&1
          BUILD=$?
          printf '{"source":%s,"typecheck":%s,"unit":%s,"build":%s}\n' "$SOURCE" "$TYPE" "$UNIT" "$BUILD" | tee artifacts/logs/result.json
          test "$SOURCE" -eq 0
          test "$TYPE" -eq 0
          test "$UNIT" -eq 0
          test "$BUILD" -eq 0
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-diagnostics-${{ github.run_id }}
          path: artifacts/logs
          if-no-files-found: error
          retention-days: 14
