name: Prosmet HTTPS Root SSH Bootstrap

on:
  workflow_run:
    workflows: ["Prosmet Main Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-https-root-ssh-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Grant narrow Caddy capability through SSH CA
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      PROSMET_PUBLIC_DOMAIN: kolibriai.online
      PROSMET_PUBLIC_IP: 78.17.4.108
      PRIMARY_WG_IP: 10.99.0.10
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
    steps:
      - name: Verify exact trusted Primary runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME}" = "prosmet-primary"
          test -n "$RELEASE_SHA"
          echo "runner=$RUNNER_NAME"
          echo "release_sha=$RELEASE_SHA"

      - name: Checkout exact deployed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          clean: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Wait for the exact internal release
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/https artifacts/release
          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3200/api/health > artifacts/release/internal-health.json 2>/dev/null && \
              grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/internal-health.json; then
              cat artifacts/release/internal-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Exact release ${RELEASE_SHA} is not healthy on port 3200." >&2
          exit 1

      - name: Grant only cap_net_bind_service using the existing SSH certificate
        id: grant
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.prosmet/ssh-bootstrap"
          KNOWN_HOSTS="$HOME/.prosmet/ssh-bootstrap/known_hosts"
          REMOTE_SCRIPT="$HOME/.prosmet/ssh-bootstrap/grant-caddy.sh"
          : > "$KNOWN_HOSTS"
          chmod 0600 "$KNOWN_HOSTS"

          cat > "$REMOTE_SCRIPT" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          SOURCE=/home/actions-runner/.prosmet/caddy/bin/prosmet-caddy
          SYSTEM=/usr/local/bin/prosmet-caddy
          test "$(id -u)" = "0"
          test -x "$SOURCE"
          install -o root -g root -m 0755 "$SOURCE" "$SYSTEM"
          /usr/sbin/setcap 'cap_net_bind_service=+ep' "$SYSTEM"
          capability="$(/usr/sbin/getcap "$SYSTEM")"
          printf '%s\n' "$capability"
          printf '%s' "$capability" | grep -q 'cap_net_bind_service'
          "$SYSTEM" version
          REMOTE
          chmod 0700 "$REMOTE_SCRIPT"

          mapfile -t certs < <(
            find "$HOME/.ssh" "$HOME/.kolibri" "$HOME/.config" \
              -maxdepth 5 -type f -name '*-cert.pub' 2>/dev/null | sort -u
          )
          echo "paired_certificate_candidates=${#certs[@]}"

          targets=(
            "root@127.0.0.1"
            "root@${PRIMARY_WG_IP}"
            "root@${PROSMET_PUBLIC_IP}"
          )

          base_options=(
            -o BatchMode=yes
            -o ConnectTimeout=8
            -o ConnectionAttempts=1
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$KNOWN_HOSTS"
            -o LogLevel=ERROR
          )

          granted=""
          for target in "${targets[@]}"; do
            echo "Trying trusted SSH CA route: ${target}"
            if ssh "${base_options[@]}" "$target" 'bash -s' < "$REMOTE_SCRIPT"; then
              granted="$target:default-identity"
              break
            fi

            for cert in "${certs[@]}"; do
              private="${cert%-cert.pub}"
              test -r "$private" || continue
              if ssh "${base_options[@]}" \
                -i "$private" \
                -o "CertificateFile=$cert" \
                "$target" 'bash -s' < "$REMOTE_SCRIPT"; then
                granted="$target:certificate"
                break 2
              fi
            done
          done

          rm -f "$REMOTE_SCRIPT"
          if [[ -z "$granted" ]]; then
            echo "Existing SSH identities on prosmet-primary did not carry a root principal." >&2
            exit 1
          fi
          echo "granted_via=$granted" >> "$GITHUB_OUTPUT"
          echo "Capability granted through $granted."

      - name: Recover and verify the public HTTPS edge
        shell: bash
        run: |
          set -Eeuo pipefail
          export PROSMET_EXPECTED_RELEASE_SHA="$RELEASE_SHA"
          bash deployment/recover-https-edge.sh "$PROSMET_PUBLIC_DOMAIN" 3200 \
            2>&1 | tee artifacts/https/recovery.log
          cp "$HOME/.prosmet/caddy/status.json" artifacts/https/status.json
          cp "$HOME/.prosmet/caddy/Caddyfile" artifacts/https/Caddyfile
          cp "$HOME/.prosmet/caddy/https-headers.txt" artifacts/https/https-headers.txt
          cp "$HOME/.prosmet/caddy/http-redirect-headers.txt" artifacts/https/http-redirect-headers.txt

          curl --fail --silent --show-error --max-time 20 \
            "https://${PROSMET_PUBLIC_DOMAIN}/api/health" | tee artifacts/release/public-health.json
          grep -q "\"releaseSha\":\"${RELEASE_SHA}\"" artifacts/release/public-health.json
          curl --fail --silent --show-error --head --max-time 20 \
            "https://${PROSMET_PUBLIC_DOMAIN}/" | tee artifacts/release/public-headers.txt
          grep -Eqi '^strict-transport-security:.*max-age=31536000' artifacts/release/public-headers.txt

      - name: Upload permission and HTTPS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosmet-https-root-ssh-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Publish bootstrap result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FINAL_STATUS: ${{ job.status }}
          GRANTED_VIA: ${{ steps.grant.outputs.granted_via }}
        with:
          script: |
            const success = process.env.FINAL_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `HTTPS ROOT SSH BOOTSTRAP ${success ? "PASS" : "FAILED"}`,
                `Commit: \`${process.env.RELEASE_SHA}\``,
                `Runner: \`prosmet-primary\``,
                `Grant route: \`${process.env.GRANTED_VIA || "none"}\``,
                `Recovery run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                process.env.SOURCE_RUN_URL ? `Production run: ${process.env.SOURCE_RUN_URL}` : "Production run: manual",
                success ? "APP: https://kolibriai.online/" : "No broad sudo permission was granted. Inspect the failed bootstrap step."
              ].join("\n\n")
            });
