name: Expose Prosmet 3200

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/expose-3200.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prosmet-expose-3200
  cancel-in-progress: true

jobs:
  expose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Publish firewall task started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `**Commit:** \`${context.sha}\``,
                `**Runner:** \`${{ runner.name }}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Updated:** ${new Date().toISOString()}`,
                "",
                "## Opening public TCP port 3200",
                "",
                "The Prosmet process is already running locally; the Primary host firewall is being updated."
              ].join("\n")
            });

      - name: Verify Primary runner and listener
        run: |
          set -Eeuo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          ss -H -ltnp 'sport = :3200' || true
          curl -fsS http://127.0.0.1:3200/api/health

      - name: Open TCP 3200 in host firewall
        run: |
          set -Eeuo pipefail
          if command -v ufw >/dev/null 2>&1; then
            STATUS="$(sudo -n ufw status 2>/dev/null || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -qi '^Status: active'; then
              sudo -n ufw allow 3200/tcp
            fi
          fi

          if command -v firewall-cmd >/dev/null 2>&1 && sudo -n firewall-cmd --state >/dev/null 2>&1; then
            sudo -n firewall-cmd --permanent --add-port=3200/tcp
            sudo -n firewall-cmd --reload
          fi

          if command -v iptables >/dev/null 2>&1 && sudo -n iptables -S INPUT >/dev/null 2>&1; then
            sudo -n iptables -C INPUT -p tcp --dport 3200 -j ACCEPT 2>/dev/null || \
              sudo -n iptables -I INPUT 1 -p tcp --dport 3200 -j ACCEPT
          fi

      - name: Verify listener after firewall update
        run: |
          set -Eeuo pipefail
          ss -H -ltnp 'sport = :3200'
          curl -fsS http://127.0.0.1:3200/api/backend/status | grep -q '"connected":true'
          echo "Prosmet is listening on 0.0.0.0:3200"

      - name: Publish firewall result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                `**Commit:** \`${context.sha}\``,
                `**Runner:** \`${{ runner.name }}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Updated:** ${new Date().toISOString()}`,
                "",
                success ? "## ✅ Prosmet is running on port 3200" : "## ❌ Port 3200 exposure failed",
                "",
                success ? "**APP:** http://78.17.4.108:3200/" : "Inspect the firewall workflow log.",
                success ? "**HEALTH:** http://78.17.4.108:3200/api/health" : "",
                success ? "**BACKEND:** http://78.17.4.108:3200/api/backend/status" : ""
              ].filter(Boolean).join("\n")
            });
