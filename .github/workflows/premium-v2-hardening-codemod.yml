name: Stage CSP-safe export architecture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic architecture patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding='utf-8')

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              source = read(path)
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old[:120]!r}')
              write(path, source.replace(old, new))

          # Zod must enter jitless mode before any project schema is constructed.
          write('lib/zod.ts', '''import { z } from "zod";

z.config({ jitless: true });

export { z };
export * from "zod";
export default z;
''')

          for base in ('app', 'components', 'lib'):
              for path in (root / base).rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                      continue
                  if path.as_posix() == 'lib/zod.ts':
                      continue
                  source = path.read_text(encoding='utf-8')
                  updated = source.replace('from "zod"', 'from "@/lib/zod"').replace("from 'zod'", "from '@/lib/zod'")
                  if updated != source:
                      path.write_text(updated, encoding='utf-8')

          write('scripts/zod-jitless-contract.mjs', '''import { readdir, readFile } from "node:fs/promises";
import { join, relative, resolve } from "node:path";

const root = process.cwd();
const wrapperPath = resolve(root, "lib/zod.ts");
const wrapper = await readFile(wrapperPath, "utf8");
const failures = [];

if (!wrapper.includes("z.config({ jitless: true })")) failures.push("lib/zod.ts:missing:jitless");
if (wrapper.indexOf("z.config({ jitless: true })") > wrapper.indexOf("export { z }")) failures.push("lib/zod.ts:config-must-precede-export");

async function walk(directory) {
  for (const entry of await readdir(directory, { withFileTypes: true })) {
    const path = join(directory, entry.name);
    if (entry.isDirectory()) await walk(path);
    else if (entry.isFile() && /\\.tsx?$/.test(path) && resolve(path) !== wrapperPath) {
      const source = await readFile(path, "utf8");
      if (/from\\s+["']zod["']/.test(source) || /require\\(\\s*["']zod["']\\s*\\)/.test(source)) {
        failures.push(`${relative(root, path)}:direct-zod-import`);
      }
    }
  }
}

for (const directory of ["app", "components", "lib"]) await walk(resolve(root, directory));

if (failures.length) {
  console.error(JSON.stringify({ status: "FAIL", contract: "zod-jitless", failures }, null, 2));
  process.exit(1);
}
console.log(JSON.stringify({ status: "PASS", contract: "zod-jitless", wrapper: "lib/zod.ts" }, null, 2));
''')

